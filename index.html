{d:67,ph:5,th:"Machine coding rep 5",why:"Scheduler problems are decided entirely on edge cases. Practise the edges.",t:[
 {id:"d67a",tr:"sys",m:60,ti:"Timed: job scheduler with cron semantics",de:"60 minutes: schedule definitions, next-run computation, at-least-once execution, retries, per-job concurrency limits, persistence. Tests must cover overlapping runs, daylight-saving transitions and missed windows after downtime. Edge cases are where this round is won."},
 {id:"d67b",tr:"dsa",m:35,ti:"Revision block",de:"Redo LeetCode 20, 150, 739, 84, 394, 227 — stacks and parsing, blank files. Parsing overlaps directly with machine-coding rounds."},

{d:68,ph:5,th:"Full-stack round rehearsal",why:"'Build this feature while I watch' is a common format and it rewards narration.",t:[
 {id:"d68a",tr:"sys",m:50,ti:"Build a feature end to end, narrating",de:"Give yourself the prompt 'add pagination and search to the run list' and implement API plus UI with loading, empty and error states, and one test — narrating tradeoffs the entire time. Time it at 50 minutes to feel the real pressure."},
 {id:"d68b",tr:"dsa",m:35,ti:"Pattern review — heaps, greedy, intervals",de:"Redo LeetCode 215, 973, 621, 56, 253, 435 — heaps, greedy and intervals, blank files. These three families overlap constantly in scheduling questions."},
 {id:"d68c",tr:"intv",m:35,ti:"Mock 4 — reverse roles first",de:"Interview a peer for 30 minutes before they interview you. Being the interviewer is the fastest way to see exactly what a weak answer sounds like from the other side of the table."}

{d:69,ph:5,th:"Writing as a hiring signal",why:"At every good company, engineers are promoted for documents. Show you can write one.",t:[
 {id:"d69a",tr:"career",m:45,ti:"Write one proper design doc",de:"For your harness, write the doc you would submit at a senior-heavy company: context, goals, non-goals, alternatives considered with reasons for rejection, chosen design, risks, rollout plan, success metrics. Publish it in the repo and link it from the portfolio."},
 {id:"d69b",tr:"dsa",m:35,ti:"Revision block",de:"Six problems from whichever two patterns you have redone least. Check patterns.md rather than guessing; memory always favours the patterns you enjoy."},
 {id:"d69c",tr:"career",m:30,ti:"Conditional applications or prep",de:"Pipeline thin: five targeted applications. Pipeline healthy: company prep and post-mortem review instead."}
]},
{d:70,ph:5,th:"Flex and revision sprint",ms:"Revision sprint complete, loops in flight",why:"Third catch-up day. Also the last good moment to fix a systematic weakness.",t:[
 {id:"d70a",tr:"rev",m:60,ti:"Catch-up, then attack the topic you dread",de:"Clear the oldest unchecked tasks. Whatever is left of the hour goes to the single topic you would least like to be asked about tomorrow."},
 {id:"d70b",tr:"rev",m:30,ti:"Weekly review and 20-day plan",de:"Write one paragraph: which processes you are betting on, what you will stop doing entirely, and your explicit accept criteria for an offer. Decide the criteria before an offer makes you emotional."},
 {id:"d70c",tr:"dsa",m:30,ti:"Speed drill",de:"Ten easy problems in 30 minutes. Rebuilds syntax speed and confidence before a heavy interview stretch."}
]},
{d:71,ph:5,th:"Offer mechanics",why:"Build the comparison framework before you have anything to compare. It will be honest that way.",t:[
 {id:"d71a",tr:"career",m:45,ti:"Build your offer comparison framework",de:"Score each opportunity on: engineering bar of the team, what you will actually build in year one, manager quality, comp (base, variable, realistic equity value), company runway and stability, learning rate, and location or remote reality. Assign weights now and write down why each weight is what it is."},
 {id:"d71b",tr:"dsa",m:35,ti:"Revision block",de:"Redo LeetCode 5, 647, 91, 139, 300, 416 — string DP and subset DP, blank files. State definition in one English sentence first, every time."},
 {id:"d71c",tr:"sys",m:35,ti:"LLD rep 6, design only",de:"35 minutes on paper: an audit-log service. Append-only model, tamper evidence, retention, query patterns, multi-tenant isolation. Directly adjacent to the compliance work enterprise customers demand."}
]},
{d:72,ph:5,th:"Compress everything you learned",why:"A two-page sheet you actually reread beats 60 pages of notes you never open.",t:[
 {id:"d72a",tr:"sys",m:55,ti:"Build your design cheat sheet",de:"Skim every case-study summary and every design you wrote in 70 days. Compress into two pages organised by problem shape: fan-out, ingest-heavy, low-latency, multi-tenant, streaming, and AI-in-the-loop. This is what you read for 20 minutes before every design round from now on."},
 {id:"d72b",tr:"dsa",m:35,ti:"Random mixed set",de:"Five random mediums. Then update patterns.md with anything you had to relearn. The file is the deliverable; the streak is not."},

]},
{d:73,ph:5,th:"Make execution repeatable",why:"Consistency beats motivation once you are doing three rounds a week.",t:[
 {id:"d73a",tr:"intv",m:50,ti:"Write your pre-round ritual and post-round log",de:"A fixed 20-minute pre-round ritual: cheat-sheet skim, two easy problems, water, quiet room, camera and editor tested. And a ten-minute post-round log template. Use both for every remaining round without exception."},
 {id:"d73b",tr:"dsa",m:35,ti:"Revision block",de:"Redo LeetCode 102, 199, 104, 226, 543, 110 — tree traversal at speed. These should be close to automatic by now; if they are not, that is useful information."},
 {id:"d73c",tr:"build",m:35,ti:"Repo maintenance",de:"Answer issues, update the README with current benchmark numbers, tag a v0.2 release with proper notes. A repo that moved last week reads completely differently from one that died in September."}
]},
{d:74,ph:5,th:"Take-home readiness",why:"Having a scaffold ready saves three hours and makes your submission look senior.",t:[
 {id:"d74a",tr:"sys",m:55,ti:"Build your take-home starter template",de:"A private template repo: TypeScript or Java scaffold, testing configured, Dockerfile, Makefile with common tasks, and a README structure with Decisions, Tradeoffs, What I Would Do With More Time, and How To Run. Reviewers read those sections first."},
 {id:"d74b",tr:"dsa",m:35,ti:"Pattern review — DP and backtracking",de:"Redo LeetCode 78, 46, 39, 79, 131, 17 — backtracking, blank files. State the pruning condition aloud before writing each recursion."},
 {id:"d74c",tr:"career",m:30,ti:"Conditional applications or prep",de:"Five targeted applications if the pipeline is thin, otherwise company prep and post-mortem review. Let the pipeline decide rather than the habit."}
]},
{d:75,ph:5,th:"Contingency checkpoint",ms:"Go / widen decision made explicitly",why:"Honesty at Day 75 is what turns a missed target into a delayed win rather than a collapse.",t:[
 {id:"d75a",tr:"career",m:55,ti:"Count late-stage processes and choose a branch",de:"Two or more late-stage: spend everything on conversion, stop applying. Zero or one: activate contingency — expand to remote and forward-deployed-engineer roles, contact five specialist recruiters, publish a fourth post, ask ten referrals in one sitting, and extend to 120 days. A 90-day target is a plan, not a verdict on your ability."},
 {id:"d75b",tr:"intv",m:40,ti:"Fix the round you keep failing",de:"From your post-mortems, find the round type you have failed twice. Do a focused 40-minute rep on it today and schedule two more this week. Repeated failure in one round type is the only pattern worth reorganising your week around."},
 {id:"d75c",tr:"dsa",m:25,ti:"Revision block",de:"Five problems from your two weakest patterns. Under interview load you lose on weak patterns, not on hard problems."}
]},
{d:76,ph:5,th:"Run the internal option too",why:"You have real leverage at Kapture. Using it well costs nothing and burns no bridge.",t:[
 {id:"d76a",tr:"career",m:45,ti:"Book a growth conversation with your manager",de:"You own a production AI workflow system a month into SDE-1. Ask what scope and band the next level requires and on what timeline. Do not mention interviewing and do not threaten to leave. Either you get a better internal path or you get clarity that justifies leaving — both are wins."},
 {id:"d76b",tr:"dsa",m:35,ti:"Random mixed set",de:"Five random mediums, 35 minutes, narrated. Random selection only — no warming up on something you already know."},
 {id:"d76c",tr:"sys",m:40,ti:"HLD rep 5: prompt and model registry",de:"Versioning, staged rollout with canaries, A/B evaluation against a suite, instant rollback, audit trail, per-tenant overrides. This sits one step from your day job — make it completely fluent."}
]},
{d:77,ph:5,th:"Full onsite simulation",why:"One full-length simulation is worth five isolated rounds at this stage.",t:[
 {id:"d77a",tr:"intv",m:50,ti:"Mock 5 — three rounds back to back",de:"DSA, design, behavioural, full length, with peers if possible. Then a 20-minute debrief with written notes on what to change before your next real onsite."},
 {id:"d77b",tr:"rev",m:35,ti:"Weekly review and funnel snapshot",de:"Log everything. Note where every live process stands and what the next action is for each."},
 {id:"d77c",tr:"career",m:35,ti:"Negotiation rehearsal, out loud",de:"Role-play the comp conversation with a friend playing a firm recruiter. Practise deflecting the first number, asking for time, presenting competing timelines, and making one specific increase request with a specific reason. Say the numbers aloud until they stop feeling rude."}
]},
{d:78,ph:5,th:"Closing mode",why:"From here, depth on a few opportunities beats breadth across many.",t:[
 {id:"d78a",tr:"intv",m:55,ti:"Final-round prep for your top opportunity",de:"Re-read their engineering blog, re-run the prep sheet, prepare three questions that show you understand their roadmap, and prepare a five-minute answer to 'what would you work on in your first 90 days here'. Almost nobody prepares that last one."},
 {id:"d78b",tr:"dsa",m:30,ti:"Revision block",de:"Six problems you know cold, 30 minutes. The days before a final round are for confidence and speed, never for new material."},
 {id:"d78c",tr:"career",m:35,ti:"Choreograph decision dates",de:"Map every live process onto a calendar with expected decision dates. Where one offer would expire before another decision lands, ask for an extension now with a professional reason. Recruiters expect this and rarely refuse."}
]},
{d:79,ph:5,th:"Refresh every surface",why:"Recruiters reopen your profile before final rounds. Make sure it improved since they last looked.",t:[
 {id:"d79a",tr:"career",m:45,ti:"Update resume, LinkedIn, portfolio, GitHub",de:"Latest benchmark numbers, three post links, the merged open-source PR, the MCP server. Same facts everywhere, no drift between surfaces — inconsistency reads as carelessness."},
 {id:"d79b",tr:"dsa",m:35,ti:"Revision block",de:"Six solved problems, blank files. Rotate to whichever pattern you last touched more than two weeks ago."},
 {id:"d79c",tr:"sys",m:40,ti:"HLD rep 6: design your top target's hardest subsystem",de:"Pick the product of the company you most want and design its most interesting subsystem in 40 minutes. If they interview you on their own domain — and many do — you will be unusually well prepared."}
]},
{d:80,ph:5,th:"Answer quality pass",why:"Ten answers cover 90% of what you will be asked. Make all ten sharp.",t:[
 {id:"d80a",tr:"intv",m:55,ti:"Tighten your ten most likely answers",de:"Walk me through your resume; hardest bug; biggest impact; a disagreement; a failure; why us; why leave; biggest technical decision; what you would rebuild; what you want to learn next. Ninety seconds each, spoken aloud, no filler, no hedging."},
 {id:"d80b",tr:"dsa",m:30,ti:"Revision block",de:"Six problems you know cold, 30 minutes. Keep your hands warm and introduce nothing new this week."},
 {id:"d80c",tr:"build",m:35,ti:"One visible improvement",de:"A single commit that improves the project on a dimension a hiring engineer would notice: a clearer quickstart, a public report page, or a second benchmark suite."}
]},
{d:81,ph:5,th:"Decision hygiene",why:"Choosing badly is a worse outcome than choosing slowly.",t:[
 {id:"d81a",tr:"career",m:50,ti:"Score every live opportunity honestly",de:"Fill in the comparison framework with what you actually know, and write the one question you still need answered for each. Then ask those questions in your next conversation with them, plainly."},
 {id:"d81b",tr:"dsa",m:35,ti:"Random mixed set",de:"Five random mediums, 35 minutes. Keep this going mid-loop — going cold for a week before a final round is common and completely avoidable."},
 {id:"d81c",tr:"intv",m:35,ti:"Reverse-interview them properly",de:"Use your ten questions in every remaining round. How a team answers 'how do you measure engineering quality' tells you more about your next two years than any comp number will."}
]},
{d:82,ph:5,th:"Negotiate",why:"One well-framed ask is worth more than all the DSA you did this month.",t:[
 {id:"d82a",tr:"career",m:55,ti:"Run the negotiation",de:"When an offer lands: thank them warmly, ask for the full breakdown in writing, ask for time, and never accept on the call. Then make one specific justified ask citing a competing timeline and your artifacts. If the band is genuinely fixed, negotiate level, scope, joining bonus, start date, or a documented six-month review instead."},
 {id:"d82b",tr:"dsa",m:30,ti:"Revision block",de:"Five familiar problems, 30 minutes. Deliberately light; your attention belongs on the negotiation today."},
 {id:"d82c",tr:"career",m:35,ti:"Notice period and transition math",de:"Work out your real exit date from your notice period and any buyout cost, and confirm what you owe on handover. Plan a clean transition. Bengaluru is a small ecosystem and your reputation compounds longer than any single offer."}
]},
{d:83,ph:5,th:"Convert or extend",why:"Either branch is a plan. Neither is a restart.",t:[
 {id:"d83a",tr:"career",m:50,ti:"Take the branch",de:"If you have an offer you would accept, run the final comparison and set a decision date. If not, write the 30-day extension plan today: which ten companies, which artifact you publish, which gap you close, what you do differently. Momentum, not a fresh start."},
 {id:"d83b",tr:"dsa",m:35,ti:"Revision block",de:"Six solved problems, blank files, rotating across patterns. Twenty-five minutes if the branch decision took longer than planned."},
 {id:"d83c",tr:"sys",m:35,ti:"LLD rep 7, design only",de:"35 minutes: a webhook delivery system. Payload signing, retries with backoff and jitter, ordering guarantees, per-endpoint circuit breaking, replay. A very common design prompt at API-first companies."}
]},
{d:84,ph:5,th:"84-day review",ms:"Offers in hand, or extension plan written",why:"This document is what makes your next switch twice as fast.",t:[
 {id:"d84a",tr:"rev",m:50,ti:"Write the full numbers down",de:"Applications, screens, onsites, offers, problems solved, hours logged, artifacts shipped, posts published. Then write what actually moved the needle and what was wasted effort. Be specific enough that a stranger could follow it."},
 {id:"d84b",tr:"career",m:40,ti:"Ask every closed process for feedback",de:"One short message to each recruiter who rejected you: what would make me a yes in a year? Store the answers. Some of these conversations reopen six months later, and warm rejections convert well."},
 {id:"d84c",tr:"rev",m:30,ti:"Recovery block",de:"Rest deliberately. You are days away from a decision that needs a clear head, not a tired one."}
]},
{d:85,ph:5,th:"Stay warm",why:"In the final stretch, staying sharp matters more than resting.",t:[
 {id:"d85a",tr:"intv",m:55,ti:"Execute or simulate",de:"Run your pre-round ritual and your best answers on whatever is scheduled. If nothing is scheduled, do a full 55-minute mock instead — going cold for a week before a final round is a common and avoidable mistake."},
 {id:"d85b",tr:"dsa",m:30,ti:"Revision block",de:"Five solved problems as part of your pre-round ritual rather than as separate study. Two easy, three medium, all familiar."},
 {id:"d85c",tr:"career",m:35,ti:"References and documents",de:"Brief your references on the role and the two things you would like them to emphasise. Gather what background checks need: payslips, current offer letter, degree certificate, PAN and UAN details."}
]},
{d:86,ph:5,th:"Model the offers",why:"Numbers on a spreadsheet argue better than numbers in your head at 11pm.",t:[
 {id:"d86a",tr:"career",m:55,ti:"Build the offer model",de:"Base, variable with a realistic payout percentage, equity at a conservative valuation, tax impact, any notice buyout cost, and a two-year total. Apply the weights you set on Day 71. Then compare the result against your gut and interrogate any gap — the gap usually contains the real information."},
 {id:"d86b",tr:"dsa",m:30,ti:"Revision block",de:"Five familiar problems, 30 minutes. Keep the habit intact through the decision week; it costs little and preserves your edge if a process reopens."},
 {id:"d86c",tr:"intv",m:35,ti:"Prepare for a counteroffer",de:"If Kapture counters, decide in advance what would genuinely change your mind: scope, level, manager, comp, or the systems you would own. Write the criteria now so the emotion of the moment does not decide for you."}
]},
{d:87,ph:5,th:"Decide",why:"Comparison after acceptance is a trap. Decide, then commit.",t:[
 {id:"d87a",tr:"career",m:55,ti:"Make the call and write down why",de:"Choose. Write one page on why, explicitly including what you are giving up. If nothing is worth accepting, write that clearly too and run the extension plan without treating it as failure — walking away from a bad fit at 13 months is a good decision, not a defeat."},
 {id:"d87b",tr:"career",m:35,ti:"Accept properly",de:"Get the final offer in writing with role, level, comp breakdown, start date and any scope or reporting commitments. Read all of it. Ask about anything ambiguous before signing, especially variable-pay mechanics, joining-bonus clawback and any bond."},
 {id:"d87c",tr:"dsa",m:30,ti:"Revision block",de:"Five solved problems. Keep the habit alive through the transition — you will be glad of it in the first month of the new role."}
]},
{d:88,ph:5,th:"Exit well",why:"You will meet these people again. Leaving well is a career asset.",t:[
 {id:"d88a",tr:"career",m:50,ti:"Resign the right way",de:"Tell your manager first, in person or on a call, before anyone else hears it. Short, gracious, no comparisons, no complaints. Offer a real transition plan and mean it. Never negotiate a counteroffer you have already decided to decline."},
 {id:"d88b",tr:"career",m:40,ti:"Write the handover documents",de:"For each system you own: architecture, runbook, known issues, who to contact, and where the risky parts are. This is the cheapest possible way to leave a strong reputation behind, and it takes one evening."},
 {id:"d88c",tr:"rev",m:30,ti:"Update your surfaces",de:"Once signed and dated, update LinkedIn and your resume. Write the honest, specific outcome line about what you built at Kapture — you will reuse it for years."}
]},
{d:89,ph:5,th:"Set up the next level",why:"Your reputation in the new role is set in the first two weeks. Prepare for them.",t:[
 {id:"d89a",tr:"career",m:50,ti:"Write your first-90-days plan for the new role",de:"What you will learn in week one, who you will meet and why, what you will ship in month one, and how you will measure your own ramp. Send a short version to your future manager before you start. Almost nobody does this and it sets your reputation on day one."},
 {id:"d89b",tr:"career",m:40,ti:"Close the loop with everyone who helped",de:"Message every person who referred you, mocked with you or reviewed your resume. Tell them what happened and thank them specifically. This network is the reason your next switch will take 30 days instead of 90."},
 {id:"d89c",tr:"rev",m:30,ti:"Archive the prep",de:"Push patterns.md, your design notes, case-study summaries, STAR stories and cheat sheet to a private repo. In two years this archive saves you a month of work."}
]},
{d:90,ph:5,th:"Compound it",ms:"Switch complete or extension underway, with a reusable system",why:"The habit is worth more than the switch.",t:[
 {id:"d90a",tr:"rev",m:50,ti:"Publish the retrospective",de:"A post on what 90 days actually looked like: what worked, what did not, the real numbers. It helps people at your level, it is excellent inbound, and writing it publicly forces honesty in a way a private doc never does."},
 {id:"d90b",tr:"career",m:40,ti:"Set the next 90 days",de:"One technical depth goal (distributed systems, or real ML rather than LLM APIs), one visible artifact goal, one relationship goal. Put them in this tracker with a new start date and run it again."},

]}

========================================== */
var KEY = "switch90.bkm.v1";
var Store = {
  mode: "memory", mem: null,
  init: function () {
    try {
      localStorage.setItem("__probe", "1");
      localStorage.removeItem("__probe");
      this.mode = "local";
    } catch (e) {
      this.mode = (typeof window !== "undefined" && window.storage) ? "cloud" : "memory";
    }
    return this.mode;
  },
  load: function () {
    var self = this;
    if (this.mode === "local") {
      try { var r = localStorage.getItem(KEY); return Promise.resolve(r ? JSON.parse(r) : null); }
      catch (e) { return Promise.resolve(null); }
    }
    if (this.mode === "cloud") {
      return window.storage.get(KEY).then(function (r) {
        return r && r.value ? JSON.parse(r.value) : null;
      }).catch(function () { return null; });
    }
    return Promise.resolve(self.mem);
  },
  save: function (obj) {
    var str = JSON.stringify(obj);
    if (this.mode === "local") {
      try { localStorage.setItem(KEY, str); } catch (e) { toast("Storage full — export a backup"); }
      return Promise.resolve(true);
    }
    if (this.mode === "cloud") {
      return window.storage.set(KEY, str).catch(function () { return null; });
    }
    this.mem = obj;
    return Promise.resolve(true);
  }
};

/* ============ STATE ============ */
var DEFAULT_START = "2026-08-15";
var S = null;
function freshState() {
  return {
    v: 1, start: DEFAULT_START,
    done: {},      // taskId -> ISO date completed
    time: {},      // taskId -> minutes logged
    daily: {},     // ISO date -> minutes logged that calendar day
    notes: {},     // day number -> free text
    apps: [],      // pipeline rows
    timer: { taskId: null, dur: 50, startedAt: null, acc: 0 },
    ui: { view: "today", openWeeks: {}, filter: "all" }
  };
}
var saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { Store.save(S); }, 220);
}

/* ============ DATE HELPERS ============ */
function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function parseISO(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayISO() { return iso(new Date()); }
function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function dayDiff(a, b) { // whole days from a to b
  var A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  var B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}
function dateForDay(n) { return addDays(parseISO(S.start), n - 1); }
var WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
var MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDay(n) { var d = dateForDay(n); return WD[d.getDay()] + " " + d.getDate() + " " + MO[d.getMonth()]; }
function fmtLong(n) { var d = dateForDay(n); return WD[d.getDay()] + ", " + d.getDate() + " " + MO[d.getMonth()] + " " + d.getFullYear(); }
function currentDayNum() { return dayDiff(parseISO(S.start), new Date()) + 1; }
function clampDay(n) { return Math.max(1, Math.min(90, n)); }

/* ============ LOOKUPS ============ */
var DAY_BY_N = {}, TASK_BY_ID = {}, DAY_OF_TASK = {};
PLAN.forEach(function (day) {
  DAY_BY_N[day.d] = day;
  day.t.forEach(function (t) { TASK_BY_ID[t.id] = t; DAY_OF_TASK[t.id] = day.d; });
});
var ALL_TASKS = PLAN.reduce(function (a, d) { return a.concat(d.t); }, []);
var TOTAL_TASKS = ALL_TASKS.length;
var TOTAL_MINS = ALL_TASKS.reduce(function (a, t) { return a + t.m; }, 0);
function phaseOf(n) {
  for (var i = 0; i < PHASES.length; i++) if (n >= PHASES[i].range[0] && n <= PHASES[i].range[1]) return PHASES[i];
  return PHASES[0];
}
function weekOf(n) { return Math.ceil(n / 7); }

/* ============ STATS ============ */
function stats() {
  var cur = currentDayNum();
  var eff = clampDay(cur);
  var started = cur >= 1, over = cur > 90;
  var doneCount = 0, doneMins = 0;
  Object.keys(S.done).forEach(function (id) { if (TASK_BY_ID[id]) { doneCount++; doneMins += TASK_BY_ID[id].m; } });
  var expTasks = 0, expMins = 0;
  if (started) PLAN.forEach(function (d) { if (d.d <= eff) { expTasks += d.t.length; expMins += d.t.reduce(function (a, t) { return a + t.m; }, 0); } });
  var logged = 0;
  Object.keys(S.time).forEach(function (k) { logged += (S.time[k] || 0); });
  var delta = doneCount - expTasks;
  var verdict, cls;
  if (!started) { verdict = "Not started"; cls = ""; }
  else if (delta >= 4) { verdict = "Ahead"; cls = "ok"; }
  else if (delta >= -2) { verdict = "On track"; cls = "ok"; }
  else if (delta >= -9) { verdict = "Slipping"; cls = "warn"; }
  else { verdict = "Behind"; cls = "bad"; }
  var overdue = [];
  if (started) PLAN.forEach(function (d) { if (d.d <= eff) d.t.forEach(function (t) { if (!S.done[t.id]) overdue.push({ day: d.d, t: t }); }); });
  var overdueMins = overdue.reduce(function (a, o) { return a + o.t.m; }, 0);
  // streak of consecutive calendar days with >=1 completion or >=15 min
  var byDate = {};
  Object.keys(S.done).forEach(function (id) { byDate[S.done[id]] = true; });
  Object.keys(S.daily).forEach(function (dt) { if (S.daily[dt] >= 15) byDate[dt] = true; });
  var streak = 0, probe = new Date();
  if (!byDate[iso(probe)]) probe = addDays(probe, -1);
  while (byDate[iso(probe)]) { streak++; probe = addDays(probe, -1); }
  return {
    cur: cur, eff: eff, started: started, over: over,
    doneCount: doneCount, doneMins: doneMins, expTasks: expTasks, expMins: expMins,
    logged: logged, delta: delta, verdict: verdict, cls: cls,
    overdue: overdue, overdueMins: overdueMins, streak: streak,
    pct: Math.round(doneCount / TOTAL_TASKS * 100),
    daysLeft: Math.max(0, 90 - Math.max(0, cur) + (cur < 1 ? 90 - 90 : 0)),
    remaining: 90 - clampDay(cur)
  };
}
function dayProgress(n) {
  var d = DAY_BY_N[n]; if (!d) return { done: 0, total: 0 };
  var done = d.t.filter(function (t) { return S.done[t.id]; }).length;
  return { done: done, total: d.t.length };
}
function dayMinutesLogged(n) {
  var d = DAY_BY_N[n]; if (!d) return 0;
  return d.t.reduce(function (a, t) { return a + (S.time[t.id] || 0); }, 0);
}

/* ============ UTIL ============ */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
function hm(min) { min = Math.round(min || 0); var h = Math.floor(min / 60), m = min % 60; return h ? (h + "h" + (m ? " " + m + "m" : "")) : (m + "m"); }
var toastT = null;
function toast(msg) {
  var el = document.getElementById("toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove("on"); }, 2100);
}

/* ============ ACTIONS ============ */
function toggleTask(id) {
  if (S.done[id]) delete S.done[id]; else S.done[id] = todayISO();
  persist(); render();
}
function logMinutes(id, mins) {
  S.time[id] = (S.time[id] || 0) + mins;
  var k = todayISO(); S.daily[k] = (S.daily[k] || 0) + mins;
  persist();
}
function selectTimerTask(id, dur) {
  S.timer.taskId = id;
  if (dur) S.timer.dur = dur;
  S.timer.startedAt = null; S.timer.acc = 0;
  persist(); render();
}
function timerElapsed() {
  var t = S.timer, e = t.acc || 0;
  if (t.startedAt) e += Math.floor((Date.now() - t.startedAt) / 1000);
  return e;
}
function timerStart() {
  if (!S.timer.taskId) { toast("Pick a task first"); return; }
  if (!S.timer.startedAt) { S.timer.startedAt = Date.now(); persist(); render(); }
}
function timerPause() {
  if (S.timer.startedAt) { S.timer.acc = timerElapsed(); S.timer.startedAt = null; persist(); render(); }
}
function timerStop(commit) {
  var secs = timerElapsed(), id = S.timer.taskId;
  if (commit && id && secs >= 60) { logMinutes(id, Math.round(secs / 60)); toast("Logged " + Math.round(secs / 60) + "m to this task"); }
  S.timer.startedAt = null; S.timer.acc = 0; persist(); render();
}
function setStart(v) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Use YYYY-MM-DD"); return; }
  S.start = v; persist(); render(); toast("Day 1 is now " + fmtLong(1));
}
function addApp(co, role, tier, stage) {
  if (!co) { toast("Company name required"); return; }

  persist(); render();
}
function exportData() {
  var blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "switch90-backup-" + todayISO() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Backup downloaded");
}
function importData(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var o = JSON.parse(r.result);
      if (!o || typeof o !== "object" || !o.done) throw 0;
      S = Object.assign(freshState(), o);
      S.ui = Object.assign(freshState().ui, o.ui || {});
      persist(); render(); toast("Backup restored");
    } catch (e) { toast("That file is not a Switch/90 backup"); }
  };

}
function resetAll() {
  if (!confirm("Erase all progress, time logs, notes and pipeline rows? Export a backup first if you want to keep them.")) return;
  var start = S.start; S = freshState(); S.start = start; persist(); render(); toast("Everything reset");

      var pc = Math.round(dn / tot * 100);
      return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px">' +
        '<span><strong style="color:' + p.c + '">' + p.n + '</strong> <span class="mut mono xs">d' + p.range[0] + '-' + p.range[1] + '</span></span>' +
        '<span class="mono xs mut">' + dn + '/' + tot + '</span></div>' +
        '<div class="bar"><i style="width:' + pc + '%;background:' + p.c + '"></i></div>' +
        '<div class="mut xs" style="margin-top:4px">' + p.blurb + '</div></div>';
    }).join("") + '</div>';
  // tracks
  var byTrack = {};
  ALL_TASKS.forEach(function (t) {
    byTrack[t.tr] = byTrack[t.tr] || { tot: 0, dn: 0, mins: 0, logged: 0 };
    byTrack[t.tr].tot++; byTrack[t.tr].mins += t.m;
    if (S.done[t.id]) byTrack[t.tr].dn++;
    byTrack[t.tr].logged += (S.time[t.id] || 0);
  });
  h += '<div class="card"><div class="eyebrow" style="margin-bottom:11px">Tracks \u2014 where the 180 hours go</div>' +
    Object.keys(TRACKS).map(function (k) {
      var b = byTrack[k]; if (!b) return "";
      var pc = Math.round(b.dn / b.tot * 100);
      return '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px">' +
        '<span><strong style="color:' + TRACKS[k].c + '">' + TRACKS[k].n + '</strong></span>' +
        '<span class="mono xs mut">' + b.dn + '/' + b.tot + ' \u00b7 ' + hm(b.mins) + ' planned</span></div>' +
        '<div class="bar"><i style="width:' + pc + '%;background:' + TRACKS[k].c + '"></i></div></div>';
    }).join("") + '</div></div>';
  // sparkline of last 14 days
  var bars = "", labels = "", max = 1;
  var days = [];
  for (var i = 13; i >= 0; i--) { var d = addDays(new Date(), -i); var m = S.daily[iso(d)] || 0; days.push({ d: d, m: m }); if (m > max) max = m; }
  days.forEach(function (x) {
    var hh = Math.max(2, Math.round(x.m / max * 56));
    bars += '<div class="' + (x.m >= 120 ? 'o' : (x.m > 0 ? 'h' : '')) + '" style="height:' + hh + 'px" title="' + iso(x.d) + ' \u2014 ' + hm(x.m) + '"></div>';
    labels += '<span>' + x.d.getDate() + '</span>';
  });
  var last7 = days.slice(7).reduce(function (a, x) { return a + x.m; }, 0);
  h += '<div class="g2 wide2" style="margin-top:14px">';
  h += '<div class="card"><div class="hd" style="margin-bottom:10px"><div class="eyebrow">Minutes logged, last 14 days</div>' +
    '<span class="mut xs mono">last 7 days: ' + hm(last7) + ' \u00b7 target 14h</span></div>' +
    '<div class="spark">' + bars + '</div><div class="sparkx">' + labels + '</div>' +
    '<div class="mut xs" style="margin-top:8px">Orange bars are days you hit the full 2 hours.</div></div>';
  // next milestones
  var next = PLAN.filter(function (d) { return d.ms && d.d >= clampDay(st.cur); }).slice(0, 4);
  h += '<div class="card"><div class="eyebrow" style="margin-bottom:10px">Next milestones</div>' +
    (next.length ? next.map(function (d) {
      return '<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="mono xs" style="color:var(--warn)">DAY ' + d.d + ' \u00b7 ' + fmtDay(d.d) + '</div><div class="sm">' + esc(d.ms) + '</div></div>';
    }).join("") : '<div class="mut sm">All milestones passed.</div>') + '</div></div>';
  // pipeline snapshot
  h += pipeSnapshot();
  return h;
}
function stat(k, v, n, hero) {
  return '<div class="stat' + (hero ? ' hero' : '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="n">' + n + '</div></div>';
}
function pipeSnapshot() {
  var c = {};
  APP_STAGES.forEach(function (s) { c[s] = 0; });
  S.apps.forEach(function (a) { c[a.stage] = (c[a.stage] || 0) + 1; });
  var live = S.apps.filter(function (a) { return ["Recruiter call", "Screen", "Onsite", "Offer"].indexOf(a.stage) >= 0; }).length;
  var applied = S.apps.filter(function (a) { return a.stage !== "Wishlist"; }).length;
  var screens = c["Screen"] + c["Onsite"] + c["Offer"];
  return '<div class="card" style="margin-top:14px"><div class="hd" style="margin-bottom:11px"><div class="eyebrow">Pipeline snapshot</div>' +
    '<button class="mini" data-act="nav" data-v="pipe">open pipeline \u2192</button></div>' +
    '<div class="funnel">' + APP_STAGES.map(function (s) { return '<div class="fn"><div class="v">' + (c[s] || 0) + '</div><div class="k">' + s + '</div></div>'; }).join("") + '</div>' +
    '<div class="mut sm">' + (applied ? ('Reply-to-screen rate ' + (applied ? Math.round(screens / applied * 100) : 0) + '% \u00b7 ' + live + ' live process' + (live === 1 ? '' : 'es') + '. ' +
      (applied >= 15 && screens === 0 ? 'Zero screens from ' + applied + ' applications means the problem is targeting or resume, not volume.' :
        (live >= 3 ? 'Healthy. Stop broad applying and go deep on conversion.' : 'Keep the top of the funnel filling.'))) :
      'No rows yet. Add companies as you build the target map on Day 2.') + '</div></div>';
}

/* ============ VIEW: ROADMAP ============ */
function viewMap() {
  var st = stats(), cur = st.started ? clampDay(st.cur) : 0;
  var f = S.ui.filter || "all";
  var h = '<div class="hd"><div><div class="eyebrow">Roadmap</div><h1>All 90 days</h1></div>' +
    '<div class="mut sm mono">' + fmtDay(1) + ' \u2192 ' + fmtDay(90) + '</div></div>';
  h += '<div class="tabs">' + [["all", "All tracks"]].concat(Object.keys(TRACKS).map(function (k) { return [k, TRACKS[k].n]; })).map(function (x) {
    return '<button data-act="filter" data-f="' + x[0] + '"' + (f === x[0] ? ' class="on"' : '') + '>' + x[1] + '</button>';
  }).join("") + '<button data-act="filter" data-f="open"' + (f === "open" ? ' class="on"' : '') + '>Open only</button>' +
    '<button data-act="expandall">Expand all</button><button data-act="collapseall">Collapse all</button></div>';
  for (var w = 1; w <= 13; w++) {
    var from = (w - 1) * 7 + 1, to = Math.min(90, w * 7);
    var daysIn = []; for (var i = from; i <= to; i++) daysIn.push(DAY_BY_N[i]);
    var tot = 0, dn = 0;
    daysIn.forEach(function (d) { tot += d.t.length; dn += d.t.filter(function (t) { return S.done[t.id]; }).length; });
    var open = S.ui.openWeeks[w] === undefined ? (cur >= from && cur <= to) : !!S.ui.openWeeks[w];
    var ph = phaseOf(from);
    h += '<div class="wk"><button class="wkhd" data-act="week" data-w="' + w + '">' +
      '<span class="n">W' + String(w).padStart(2, "0") + '</span>' +
      '<span class="ti">' + weekTitle(w) + '</span>' +
      '<span class="mut xs mono">d' + from + '-' + to + ' \u00b7 ' + fmtDay(from) + '</span>' +
      '<span class="pill" style="color:' + ph.c + ';border-color:' + ph.c + '55">' + ph.n + '</span>' +
      '<span class="mono xs" style="color:' + (dn === tot ? 'var(--done)' : 'var(--muted)') + '">' + dn + '/' + tot + '</span>' +
      '<span class="mut">' + (open ? '\u2212' : '+') + '</span></button>';
    if (open) {
      h += '<div class="wkbd">';
      daysIn.forEach(function (d) {
        var tasks = d.t.filter(function (t) {
          if (f === "all") return true;
          if (f === "open") return !S.done[t.id];
          return t.tr === f;
        });
        if (!tasks.length) return;
        var p = dayProgress(d.d);
        h += '<div class="dayrow"><div class="dayhd">' +
          '<span class="dnum' + (d.d === cur ? ' is-today' : '') + '">Day ' + d.d + '</span>' +
          '<span class="mut xs mono">' + fmtDay(d.d) + '</span>' +
          '<span style="font-weight:600;font-size:14px">' + esc(d.th) + '</span>' +
          '<span class="mono xs" style="color:' + (p.done === p.total ? 'var(--done)' : 'var(--faint)') + ';margin-left:auto">' + p.done + '/' + p.total + '</span></div>' +
          (d.why ? '<div class="dwhy">' + esc(d.why) + '</div>' : '') +
          (d.ms ? '<div class="msline">\u25C6 MILESTONE \u2014 ' + esc(d.ms) + '</div>' : '') +
          tasks.map(function (t) { return taskHTML(t, d.d); }).join("") + '</div>';
      });
      h += '</div>';
    }
    h += '</div>';
  }
  return h;
}
var WEEK_TITLES = {
  1: "Positioning, resume rebuild, public surfaces",
  2: "Backend depth + the harness core",
  3: "Judge validation, LLD foundations, first post",
  4: "Deploy, observability, enter the market",
  5: "Benchmark, first mocks, runtime depth",
  6: "HLD reps, security story, machine coding",
  7: "MCP, agentic dev loop, testing credibility",
  8: "Comp research, portfolio, post-mortems",
  9: "Company-specific prep, distributed systems, OSS PR",
  10: "Concurrency, behavioural mastery, reliability",
  11: "Writing, take-home readiness, contingency checkpoint",
  12: "Closing mode, negotiation, decision hygiene",
  13: "Decide, exit well, compound it"
};
function weekTitle(w) { return WEEK_TITLES[w] || "Week " + w; }

/* ============ VIEW: PIPELINE ============ */
function viewPipe() {
  var h = '<div class="hd"><div><div class="eyebrow">Pipeline</div><h1>Applications and processes</h1></div>' +
    '<span class="mut sm mono">' + S.apps.length + ' rows</span></div>';
  h += pipeSnapshot().replace('<div class="card" style="margin-top:14px">', '<div class="card" style="margin-bottom:14px">');
  h += '<div class="card" style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:9px">Add a row</div>' +
    '<div class="addform">' +
    '<input id="ac" placeholder="Company">' +
    '<input id="ar" placeholder="Role / team">' +
    '<select id="at"><option value="A">Tier A \u2014 stretch</option><option value="B" selected>Tier B \u2014 best fit</option><option value="C">Tier C \u2014 safety</option></select>' +
    '<button class="btn pri" data-act="addapp">Add</button></div>' +
    '<div class="mut xs">Target mix: roughly 60% tier B, 25% tier A, 15% tier C. Log the channel in the note field \u2014 you need channel conversion data on Day 35.</div></div>';
  if (!S.apps.length) {
    h += '<div class="card"><strong>Nothing here yet.</strong><div class="mut sm" style="margin-top:4px">Day 2 builds your target map of 25 companies and Day 10 takes it to 50. Add them here as you go so the funnel maths on Day 28, 35 and 56 has something to work with.</div></div>';
    return h;
  }
  h += S.apps.map(function (a) {
    return '<div class="approw">' +
      '<div><div style="font-weight:600">' + esc(a.co) + '</div><div class="mut xs">' + esc(a.role || "\u2014") + '</div></div>' +
      '<div><select data-act="stage" data-id="' + a.id + '">' + APP_STAGES.map(function (s) { return '<option' + (a.stage === s ? ' selected' : '') + '>' + s + '</option>'; }).join("") + '</select></div>' +
      '<div class="mono xs mut">Tier ' + esc(a.tier) + '<br>' + esc(a.date) + '</div>' +
      '<div><button class="mini" data-act="delapp" data-id="' + a.id + '">remove</button></div>' +
      '<div style="grid-column:1/-1"><input data-act="appnote" data-id="' + a.id + '" value="' + esc(a.note || "") + '" placeholder="Channel (referral / recruiter DM / portal / inbound), contact name, next action, date" style="width:100%"></div>' +
      '</div>';
  }).join("");
  return h;
}

/* ============ VIEW: PLAYBOOK ============ */
function viewPlay() {
  return '<div class="hd"><div><div class="eyebrow">Playbook</div><h1>The read on you, and the bet</h1></div></div><div class="prose">' + PLAYBOOK + '</div>';
}

/* ============ VIEW: RESOURCES ============ */
function viewRes() {
  var h = '<div class="hd"><div><div class="eyebrow">Resources</div><h1>Everything the plan links to</h1></div></div>' +
    '<p class="mut sm" style="max-width:700px">Production-level sources only: official docs, engineering blogs, primary write-ups from people who ship. No course funnels, no beginner tutorials \u2014 you are past that.</p>';
  RESOURCES.forEach(function (g) {
    h += '<h2 style="margin:22px 0 10px">' + g.g + '</h2><div class="reslist">' +
      g.items.map(function (it) {
        return '<div class="res"><a href="' + esc(it.u) + '" target="_blank" rel="noopener">' + esc(it.t) + ' \u2197</a><p>' + esc(it.d) + '</p></div>';
      }).join("") + '</div>';
  });
  return h;
}

/* ============ VIEW: DATA ============ */
function viewData() {
  var st = stats();
  return '<div class="hd"><div><div class="eyebrow">Data</div><h1>Start date, backup, reset</h1></div>' +
    '<span class="pill">storage: ' + Store.mode + '</span></div>' +
    '<div class="card" style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:8px">Start date \u2014 everything else is calculated from this</div>' +
    '<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">' +
    '<input id="startin" type="date" value="' + esc(S.start) + '">' +
    '<button class="btn" data-act="setstart">Apply</button>' +
    '<button class="btn gh" data-act="startnow">Start today</button>' +
    '<button class="btn gh" data-act="startdefault">Reset to 15 Aug 2026</button></div>' +
    '<div class="mut sm" style="margin-top:9px">Day 1 = ' + fmtLong(1) + ' \u00b7 Day 90 = ' + fmtLong(90) + ' \u00b7 currently on day ' + st.cur + '. ' +
    'The weekly rhythm assumes a Saturday start: the first two days of each 7-day block are longer build blocks, the other five are 2-hour weekday sessions.</div></div>' +
    '<div class="card" style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:8px">Backup and restore</div>' +
    '<div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn pri" data-act="export">Download backup</button>' +
    '<button class="btn" data-act="import">Restore from file</button></div>' +
    '<div class="mut sm" style="margin-top:9px">The backup is a plain JSON file with your completions, time logs, notes and pipeline. Storage mode is <strong>' + Store.mode + '</strong>' +
    (Store.mode === "memory" ? ' \u2014 this session only. Download the file and open it in your own browser for persistence across restarts.' :
      (Store.mode === "cloud" ? ' \u2014 persisted by the host environment.' : ' \u2014 persisted in this browser across refreshes and restarts. Take a backup weekly anyway.')) + '</div></div>' +
    '<div class="card" style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:8px">Current totals</div>' +
    '<div class="mono sm mut" style="line-height:1.9">tasks complete: ' + st.doneCount + ' / ' + TOTAL_TASKS + '<br>time logged: ' + hm(st.logged) + ' of ' + hm(TOTAL_MINS) + ' planned<br>' +
    'notes written: ' + Object.keys(S.notes).filter(function (k) { return S.notes[k]; }).length + '<br>pipeline rows: ' + S.apps.length + '<br>streak: ' + st.streak + ' days</div></div>' +
    '<div class="card"><div class="eyebrow" style="margin-bottom:8px">Danger zone</div>' +
    '<button class="btn dgr" data-act="reset">Erase everything</button>' +
    '<div class="mut sm" style="margin-top:9px">Wipes completions, time, notes and pipeline. Keeps your start date. Not reversible without a backup.</div></div>';
}

/* ============ RENDER ============ */
var tick = null;
function render() {
  var v = S.ui.view || "today";
  document.getElementById("nav").innerHTML = VIEWS.map(function (x) {
    var badge = "";
    if (x.k === "today") { var st = stats(); var p = st.started ? dayProgress(clampDay(st.cur)) : { done: 0, total: 0 }; if (p.total - p.done > 0) badge = '<span class="badge">' + (p.total - p.done) + '</span>'; }
    return '<button data-act="nav" data-v="' + x.k + '"' + (v === x.k ? ' class="on"' : '') + '><span class="ic">' + x.ic + '</span>' + x.n + badge + '</button>';
  }).join("");
  document.getElementById("mobnav").innerHTML = VIEWS.map(function (x) {
    return '<button data-act="nav" data-v="' + x.k + '"' + (v === x.k ? ' class="on"' : '') + '><span class="ic">' + x.ic + '</span>' + x.n + '</button>';
  }).join("");
  var stt = stats();
  document.getElementById("railfoot").innerHTML = 'Day ' + (stt.started ? clampDay(stt.cur) : 0) + '/90<br>' + stt.pct + '% complete<br>' + hm(stt.logged) + ' logged<br><span style="color:var(--faint)">storage: ' + Store.mode + '</span>';
  var html = v === "today" ? viewToday() : v === "dash" ? viewDash() : v === "map" ? viewMap() :
    v === "pipe" ? viewPipe() : v === "play" ? viewPlay() : v === "res" ? viewRes() : viewData();
  document.getElementById("view").innerHTML = html;
  clearInterval(tick);
  if (v === "today" && S.timer.startedAt) {
    tick = setInterval(function () {
      var el = document.querySelector(".clock");
      if (!el) { clearInterval(tick); return; }
      var total = S.timer.dur * 60, secs = timerElapsed(), left = Math.max(0, total - secs);
      el.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
      var bar = document.querySelector(".timer .bar > i");
      if (bar) bar.style.width = Math.min(100, secs / total * 100) + "%";
      if (left === 0) { clearInterval(tick); timerStop(true); toast("Session done \u2014 time logged"); }
    }, 1000);
  }
}

/* ============ EVENTS ============ */
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var a = b.getAttribute("data-act");
  if (a === "nav") { go(b.getAttribute("data-v")); return; }
  if (a === "toggle") { toggleTask(b.getAttribute("data-id")); return; }
  if (a === "focus") { selectTimerTask(b.getAttribute("data-id"), +b.getAttribute("data-m") > 60 ? 50 : +b.getAttribute("data-m")); go("today"); return; }
  if (a === "log15") { logMinutes(b.getAttribute("data-id"), 15); render(); toast("+15m logged"); return; }
  if (a === "dur") { S.timer.dur = +b.getAttribute("data-m"); persist(); render(); return; }
  if (a === "start") { timerStart(); return; }
  if (a === "pause") { timerPause(); return; }
  if (a === "stopsave") { timerStop(true); return; }
  if (a === "discard") { timerStop(false); return; }
  if (a === "jump") { var d = +b.getAttribute("data-d"); S.ui.view = "map"; S.ui.openWeeks[weekOf(d)] = true; persist(); render(); setTimeout(function () { var els = document.querySelectorAll(".dnum"); for (var i = 0; i < els.length; i++) if (els[i].textContent === "Day " + d) { els[i].scrollIntoView({ block: "center", behavior: "smooth" }); break; } }, 60); return; }
  if (a === "week") { var w = +b.getAttribute("data-w"); var cur = stats().started ? clampDay(stats().cur) : 0; var open = S.ui.openWeeks[w] === undefined ? (cur >= (w - 1) * 7 + 1 && cur <= w * 7) : !!S.ui.openWeeks[w]; S.ui.openWeeks[w] = !open; persist(); render(); return; }
  if (a === "expandall") { for (var i = 1; i <= 13; i++) S.ui.openWeeks[i] = true; persist(); render(); return; }
  if (a === "collapseall") { for (var j = 1; j <= 13; j++) S.ui.openWeeks[j] = false; persist(); render(); return; }
  if (a === "filter") { S.ui.filter = b.getAttribute("data-f"); persist(); render(); return; }
  if (a === "startnow") { setStart(todayISO()); return; }
  if (a === "startdefault") { setStart(DEFAULT_START); return; }
  if (a === "goplay") { go("play"); return; }
  if (a === "setstart") { setStart(document.getElementById("startin").value); return; }
  if (a === "export") { exportData(); return; }
  if (a === "import") { document.getElementById("importfile").click(); return; }
  if (a === "reset") { resetAll(); return; }
  if (a === "addapp") { addApp(document.getElementById("ac").value.trim(), document.getElementById("ar").value.trim(), document.getElementById("at").value); return; }
  if (a === "delapp") { var id = b.getAttribute("data-id"); S.apps = S.apps.filter(function (x) { return x.id !== id; }); persist(); render(); return; }
});
document.addEventListener("change", function (e) {
  var el = e.target, a = el.getAttribute && el.getAttribute("data-act");
  if (a === "stage") {
    var row = S.apps.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
    if (row) { row.stage = el.value; persist(); render(); }
  }
  if (el.id === "importfile" && el.files && el.files[0]) { importData(el.files[0]); el.value = ""; }
});
document.addEventListener("input", function (e) {
  var el = e.target;
  if (el.id === "dnote") {
    var n = clampDay(currentDayNum());
    S.notes[n] = el.value; persist();
  }
  if (el.getAttribute && el.getAttribute("data-act") === "appnote") {
    var row = S.apps.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
    if (row) { row.note = el.value; persist(); }
  }
});
document.addEventListener("keydown", function (e) {
  var tn = e.target.tagName;
  if (tn === "INPUT" || tn === "TEXTAREA" || tn === "SELECT" || tn === "BUTTON") return;
  var map = { "1": "today", "2": "dash", "3": "map", "4": "pipe", "5": "play", "6": "res", "7": "data" };
  if (map[e.key]) { go(map[e.key]); return; }
  if (e.key === " " && S.ui.view === "today") { e.preventDefault(); S.timer.startedAt ? timerPause() : timerStart(); }
});
window.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });

/* ============ BOOT ============ */
Store.init();
Store.load().then(function (saved) {
  S = freshState();
  if (saved && typeof saved === "object") {
    S = Object.assign(S, saved);
    S.ui = Object.assign(freshState().ui, saved.ui || {});
    S.timer = Object.assign(freshState().timer, saved.timer || {});
  }
  render();
  if (Store.mode === "memory") toast("Preview mode \u2014 download the file for permanent saving");
});
</script>
