<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switch/90 — Bhupendra Kumawat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1420; --panel:#171E2C; --panel2:#1D2637; --panel3:#232E43;
  --line:#2A3550; --line2:#374765;
  --text:#E7ECF6; --muted:#8B9AB6; --faint:#5F6E8C;
  --signal:#FF7A2F; --route:#4CC9F0; --done:#5BD99A; --warn:#FFC857; --late:#F2545B; --violet:#A78BFA; --pink:#F472B6;
  --tr-dsa:#4CC9F0; --tr-build:#FF7A2F; --tr-sys:#A78BFA; --tr-ai:#5BD99A; --tr-career:#FFC857; --tr-intv:#F472B6; --tr-rev:#8B9AB6;
  --ph1:#4CC9F0; --ph2:#5BD99A; --ph3:#FFC857; --ph4:#FF7A2F; --ph5:#F472B6;
  --disp:"Archivo",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --maxw:1180px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text); font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 500px at 80% -10%, rgba(76,201,240,.07), transparent 60%),radial-gradient(900px 400px at 5% 0%, rgba(255,122,47,.05), transparent 55%);
  background-attachment:fixed;
}
a{color:var(--route); text-decoration:none; border-bottom:1px solid rgba(76,201,240,.28)}
a:hover{border-bottom-color:var(--route)}
button{font-family:inherit; font-size:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--signal); outline-offset:2px; border-radius:4px}
input,textarea,select{font-family:inherit;font-size:14px;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus,select:focus{border-color:var(--line2);outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- shell ---------- */
.wrap{display:flex;min-height:100vh;align-items:stretch}
.rail{
  width:210px;flex:0 0 210px;border-right:1px solid var(--line);padding:20px 14px 24px;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:rgba(15,20,32,.7);backdrop-filter:blur(6px)
}
.brand{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.02em;margin:0 6px 2px}
.brand span{color:var(--signal)}
.brand-sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin:0 6px 18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--muted);
  padding:9px 10px;border-radius:8px;font-size:14px;font-weight:500;transition:background .15s,color .15s
}
.nav button:hover{background:var(--panel);color:var(--text)}
.nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--signal)}
.nav .ic{width:16px;text-align:center;font-size:13px;opacity:.9}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--signal);color:#1a0d03;border-radius:20px;padding:1px 6px;font-weight:600}
.railfoot{margin-top:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:0 6px;line-height:1.6}
.main{flex:1;min-width:0;padding:26px 30px 90px}
.inner{max-width:var(--maxw);margin:0 auto}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--disp);letter-spacing:-.015em;margin:0}
h1{font-size:27px;font-weight:700}
h2{font-size:19px;font-weight:600}
h3{font-size:15.5px;font-weight:600}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--mono)}
.mut{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:12px}

/* ---------- panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card.tight{padding:13px 14px}
.grid{display:grid;gap:14px}
.g2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g2.wide{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g2.wide2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* ---------- route strip (signature) ---------- */
.route{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px;position:relative;overflow:hidden}
.routetop{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;gap:14px;flex-wrap:wrap}
.bigday{font-family:var(--disp);font-weight:700;font-size:40px;line-height:.95;letter-spacing:-.03em}
.bigday small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.ticks{display:flex;gap:1px;align-items:flex-end;height:46px;padding-bottom:14px;position:relative}
.tick{flex:1 1 0;min-width:2px;border-radius:2px 2px 0 0;background:var(--line);height:12px;position:relative;border:0;padding:0;transition:height .18s,opacity .18s;opacity:.55}
.tick:hover{opacity:1;height:26px}
.tick.p{opacity:.9}
.tick.full{height:24px}
.tick.part{height:18px}
.tick.today{background:var(--signal)!important;height:34px;opacity:1;box-shadow:0 0 0 1px var(--ink),0 0 12px rgba(255,122,47,.7)}
.tick.ms::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--text);opacity:.75}
.tick.past{opacity:.38}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:var(--disp);font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:3px;line-height:1.1}
.stat .n{font-size:12px;color:var(--muted);margin-top:1px}
.stat.hero{background:linear-gradient(160deg,rgba(255,122,47,.14),var(--panel) 60%);border-color:rgba(255,122,47,.35)}

.bar{height:6px;background:var(--panel3);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--route);transition:width .4s}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.pill.ok{color:var(--done);border-color:rgba(91,217,154,.45);background:rgba(91,217,154,.09)}
.pill.warn{color:var(--warn);border-color:rgba(255,200,87,.45);background:rgba(255,200,87,.09)}
.pill.bad{color:var(--late);border-color:rgba(242,84,91,.45);background:rgba(242,84,91,.09)}
.pill.hot{color:var(--signal);border-color:rgba(255,122,47,.5);background:rgba(255,122,47,.1)}

/* ---------- tasks ---------- */
.task{display:flex;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);align-items:flex-start;position:relative}
.task + .task{margin-top:9px}
.task.done{opacity:.55;background:var(--ink)}
.task.done .t-ti{text-decoration:line-through;text-decoration-color:var(--faint)}
.cbx{flex:0 0 20px;width:20px;height:20px;margin-top:2px;border-radius:6px;border:1.5px solid var(--line2);background:transparent;display:grid;place-items:center;color:transparent;font-size:12px;transition:.15s}
.cbx:hover{border-color:var(--done)}
.cbx.on{background:var(--done);border-color:var(--done);color:#08301e}
.t-body{flex:1;min-width:0}
.t-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.t-ti{font-weight:600;font-size:14.5px}
.t-de{color:var(--muted);font-size:13.5px}
.t-lk{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap}
.t-lk a{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--route)}
.trk{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px;font-weight:600}
.min{font-family:var(--mono);font-size:11px;color:var(--faint)}
.t-act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mini{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;white-space:nowrap}
.mini:hover{color:var(--text);border-color:var(--line2)}
.mini.on{color:var(--signal);border-color:rgba(255,122,47,.5)}
.logged{font-family:var(--mono);font-size:10.5px;color:var(--done)}

/* ---------- timer ---------- */
.timer{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px}
.clock{font-family:var(--mono);font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.clock.run{color:var(--signal)}
.tbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--panel3);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:8px 14px;font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--signal);border-color:var(--signal);color:#26120a;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gh{background:transparent}
.btn.dgr{color:var(--late);border-color:rgba(242,84,91,.4)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.presets button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:3px 11px;font-family:var(--mono);font-size:11px}
.presets button.on{border-color:var(--signal);color:var(--signal)}

/* ---------- roadmap ---------- */
.wk{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);margin-bottom:10px}
.wkhd{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--text);padding:13px 15px;text-align:left}
.wkhd:hover{background:var(--panel2)}
.wkhd .n{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em}
.wkhd .ti{font-family:var(--disp);font-weight:600;font-size:15px;flex:1;min-width:0}
.wkbd{padding:0 15px 15px;border-top:1px solid var(--line)}
.dayrow{padding:14px 0;border-bottom:1px dashed var(--line)}
.dayrow:last-child{border-bottom:0}
.dayhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dnum{font-family:var(--disp);font-weight:700;font-size:15px}
.dnum.is-today{color:var(--signal)}
.dwhy{color:var(--faint);font-size:13px;font-style:italic;margin:-2px 0 9px}
.msline{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--warn);margin-bottom:8px;letter-spacing:.04em}

/* ---------- prose ---------- */
.prose{max-width:820px}
.prose h2{margin:26px 0 10px}
.prose h3{margin:20px 0 6px}
.prose p{margin:0 0 11px;color:#D2DAEA}
.prose ul{margin:0 0 12px;padding-left:20px;color:#D2DAEA}
.prose li{margin-bottom:6px}
.prose strong{color:#fff;font-weight:600}
.prose .callout{border-left:2px solid var(--signal);background:rgba(255,122,47,.06);padding:12px 15px;border-radius:0 8px 8px 0;margin:14px 0}
.prose .callout.c2{border-color:var(--route);background:rgba(76,201,240,.06)}
.prose .callout.c3{border-color:var(--late);background:rgba(242,84,91,.06)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500}
.reslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:9px}
.res{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.res a{font-weight:600;font-size:13.5px;border:0}
.res p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}

/* ---------- apps tracker ---------- */
.approw{display:grid;grid-template-columns:1.5fr 1fr .9fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.approw + .approw{margin-top:7px}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.fn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px}
.fn .v{font-family:var(--disp);font-size:22px;font-weight:700}
.fn .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.addform{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:8px;margin-bottom:12px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--panel3);border:1px solid var(--line2);color:var(--text);padding:10px 18px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:5px 13px;font-size:13px}
.tabs button.on{color:var(--text);border-color:var(--line2);background:var(--panel2)}
.mobnav{display:none}
.hidden{display:none!important}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px}
.spark div{flex:1;background:var(--panel3);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.spark div.h{background:var(--route)}
.spark div.o{background:var(--signal)}
.sparkx{display:flex;gap:3px;font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:4px}
.sparkx span{flex:1;text-align:center}

@media(max-width:900px){
  .rail{display:none}
  .main{padding:16px 15px 96px}
  .bigday{font-size:33px}
  .clock{font-size:38px}
  .g2,.g2.wide,.g2.wide2{grid-template-columns:1fr}
  .prose table{font-size:12.5px}
  .prose th,.prose td{padding:7px 6px}
  .approw{grid-template-columns:1fr 1fr;row-gap:8px}
  .addform{grid-template-columns:1fr 1fr}
  .mobnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(15,20,32,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))
  }
  .mobnav button{flex:1;min-width:0;background:none;border:0;color:var(--faint);font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-family:var(--mono);letter-spacing:.04em}
  .mobnav button .ic{font-size:14px}
  .mobnav button.on{color:var(--signal)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="rail">
    <div class="brand">Switch<span>/90</span></div>
    <div class="brand-sub">Bhupendra Kumawat</div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot" id="railfoot"></div>
  </aside>
  <main class="main"><div class="inner" id="view"></div></main>
</div>
<nav class="mobnav" id="mobnav"></nav>

<script>

 {id:"d1a",tr:"career",m:45,ti:"Build the Brag Doc — 25 entries minimum",de:"One doc. For every feature, bug, incident and release you touched at Kapture since Aug 2025 write: Problem / What you did / Tech / Measurable outcome. Mine Jira, 'git log --author=you --since=2025-08-01', PR descriptions, dashboards and release notes for real numbers. This doc feeds your resume, LinkedIn and every behavioural answer for 90 days."},
 {id:"d1b",tr:"dsa",m:45,ti:"Honest DSA baseline, timed",de:"Timer on, no hints, no editorial: LeetCode 3 (Longest Substring Without Repeating Characters) and 200 (Number of Islands). Record time taken, whether you actually finished, and the exact moment you froze. This is your starting line — write the number down so Day 45 means something.",lk:[{t:"NeetCode practice grid",u:"https://neetcode.io/practice"}]},

 {id:"d2c",tr:"ai",m:30,ti:"Read: Applied LLMs, tactical section",de:"Skim to prompting, RAG, evals and monitoring. Mark five practices you already do at work and two you do not. The five become interview stories; the two become project work this month.",lk:[{t:"applied-llms.org",u:"https://applied-llms.org/"}]}
]},
{d:3,ph:1,th:"Resume rewrite I",why:"Your resume currently reads '1 month as SDE-1'. Told honestly as one continuous year at Kapture, it reads like a strong 1-YOE engineer.",t:[
 {id:"d3a",tr:"career",m:60,ti:"Rewrite the Experience block as one tenure",de:"Collapse two headers into one: 'Kapture CX — Bengaluru — Aug 2025 to Present (Software Engineer Intern to SDE-1)'. Rewrite every bullet as Action + system + measurable result. Cut soft openers like 'Own end-to-end delivery of'; start with Built, Cut, Reduced, Shipped, Hardened. Numbers come from the brag doc, not memory.",lk:[{t:"Resume guide",u:"https://www.techinterviewhandbook.org/resume/"}]},
 {id:"d3b",tr:"dsa",m:35,ti:"Pattern 1 — arrays and hashing",de:"LeetCode 217, 242, 1, 49, 347. After each one, add a single line to a new file called patterns.md: what signal in the problem told you to reach for a hash map. That file, not your solutions, is what you revise in week 10."},
 {id:"d3c",tr:"career",m:25,ti:"LinkedIn headline and About",de:"Headline = role + lane + proof: 'SDE-1 at Kapture CX | Production conversational AI — LLM voice/chat, RAG, evals | React, Node, Spring Boot'. About = four short paragraphs: what you build, systems you have shipped with numbers, your stack, what you want next. No buzzword soup, no third person."}
]},
{d:4,ph:1,th:"Resume rewrite II",why:"Skills sections get skimmed in four seconds. Yours should answer 'what is this person actually deep in'.",t:[
 {id:"d4a",tr:"career",m:45,ti:"Fix Skills and trim Projects",de:"Split skills into Core (TypeScript, React, Node, Postgres, LLM APIs), Working (Spring Boot, Redis, Kafka, Docker, CI/CD) and Familiar. Add an AI line that says something real: RAG, prompt versioning, LLM-as-judge evals, tool/function calling, SSE streaming. Keep two projects only, each with one outcome line."},
 {id:"d4b",tr:"dsa",m:45,ti:"Pattern 2 — two pointers and sliding window",de:"LeetCode 125, 167, 15, 121, 3, 424. Rule for the next 90 days: if you are stuck past 12 minutes, read the editorial, close it, then re-implement from a blank file in the same session. Stuck-and-scrolling is the biggest time sink in DSA prep."},
 {id:"d4c",tr:"career",m:30,ti:"Set up your public surfaces",de:"Add your LeetCode profile URL to the resume header. Create a writing home (Hashnode, Substack, or a /writing folder in a GitHub repo) with your name and a one-line bio. You will publish three technical posts in the next 60 days — the home has to exist first."}
]},
{d:5,ph:1,th:"GitHub as a storefront",why:"Recruiters open exactly one repo. Make it read like an engineer wrote it, not a student.",t:[
 {id:"d5a",tr:"career",m:50,ti:"Rewrite the chess repo README",de:"Give it: one-paragraph problem statement, a real architecture diagram exported to PNG in the repo, the Socket.IO room model and WebRTC signalling flow explained in six lines, your reconnection strategy, a GIF of two players mid-game, a live link, and a short 'what I would change now' section. That last section is what senior engineers read.",lk:[{t:"Excalidraw",u:"https://excalidraw.com/"}]},
 {id:"d5b",tr:"dsa",m:40,ti:"Pattern 3 — stack and monotonic stack",de:"LeetCode 20, 155, 150, 739, 22. Pattern line for patterns.md: 'next greater / next smaller / span until' means monotonic stack."},
 {id:"d5c",tr:"career",m:30,ti:"GitHub profile README and pins",de:"Create the bKM8383/bKM8383 profile repo: what you work on, current lane, three pinned projects with one line of value each, contact links. Pin chess, ProjectForge and the repo you create on Day 7. Delete or unpin anything that looks like coursework."}
]},
{d:6,ph:1,th:"Design the flagship",why:"One deep, unusual project beats five tutorials. Yours should be the thing almost no 1-YOE engineer has.",t:[
 {id:"d6a",tr:"build",m:60,ti:"Write the design doc for ConvoEval",de:"An open-source test harness for conversational AI. Sections: goals, non-goals, YAML scenario schema (persona, goal, success criteria, expected tool calls), LLM user-simulator, deterministic assertions plus an LLM judge, metrics (task success rate, turns to resolution, tool-call accuracy, p50/p95 latency, cost per conversation), and a CI gate that fails a PR on quality regression. Strictly generic: no Kapture code, prompts, customer data or internal architecture."},
 {id:"d6b",tr:"sys",m:35,ti:"Read what a real eval system needs",de:"Read Hamel Husain on evals and pull five concrete requirements into your design doc — especially error analysis, assertion-style tests versus judge scoring, and why you log every trace. This is the reference you will cite in interviews.",lk:[{t:"Your AI product needs evals",u:"https://hamel.dev/blog/posts/evals/"}]},
 {id:"d6c",tr:"dsa",m:25,ti:"Pattern 4 — binary search",de:"LeetCode 704, 74, 875. The line for patterns.md: if you can write a monotonic yes/no predicate over the answer space, you can binary search the answer itself, not just the array."}
]},
{d:7,ph:1,th:"Ship the scaffold, close week 1",ms:"Resume v2, LinkedIn, GitHub and flagship repo all live",why:"A public first commit today makes the project real instead of aspirational.",t:[
 {id:"d7a",tr:"build",m:50,ti:"Scaffold the repo properly, in public",de:"TypeScript, pnpm workspace, Fastify or Express API, Postgres via Drizzle or Prisma, Redis + BullMQ for run queues, Vitest, ESLint, Dockerfile plus docker-compose, MIT licence, GitHub Actions running lint and tests on PR. Commit the README skeleton with the architecture diagram. Public repo, real commit, today."},
 {id:"d7b",tr:"rev",m:40,ti:"First weekly review",de:"In the tracker notes answer: what shipped, what slipped, hours logged, problems solved, outreach sent. Then name the single biggest bottleneck for next week and one sentence on how you remove it. Do this every seventh day without exception."},
 {id:"d7c",tr:"career",m:30,ti:"Three no-ask messages",de:"Message three people — LPU alumni at product companies, ex-colleagues, engineers whose posts you actually read. Ask one specific technical question or comment substantively on their work. Do not mention job hunting. You are building the surface you will ask for a referral from in week 3."}
]},
{d:8,ph:2,th:"Runner core",why:"Weekend blocks are for the project. Uninterrupted build time is worth double.",t:[
 {id:"d8a",tr:"build",m:75,ti:"Scenario schema and run loop",de:"Define the YAML scenario schema with a Zod parser. Implement a runner that loads a scenario, opens a session against a target bot over HTTP, drives five hard-coded turns, records every request and response with timestamps, and writes a run record to Postgres. Ship a mock echo bot so you can develop without burning tokens."},
 {id:"d8b",tr:"dsa",m:45,ti:"Pattern 5 — linked lists, then LRU",de:"LeetCode 206, 21, 143, 19, 141. Then implement 146 LRU Cache from scratch with a hash map plus doubly linked list. LRU shows up constantly in Indian machine-coding screens — know it cold, no library."}
]},
{d:9,ph:2,th:"The user simulator",why:"A bot that talks to your bot is the whole trick. Make it reproducible.",t:[
 {id:"d9a",tr:"build",m:75,ti:"LLM-driven user simulator with versioned prompts",de:"Give the simulator a persona, a goal and a stop condition; it generates the next user turn from the conversation so far. Store prompts as versioned rows (prompt_id, version, text, created_at) so any run can be reproduced exactly. Hard-cap turns and set a token budget per run so a loop cannot bankrupt you.",lk:[{t:"Claude API docs",u:"https://docs.claude.com/"}]},
 {id:"d9b",tr:"ai",m:45,ti:"Read: Building effective agents",de:"Read Anthropic's post and map each pattern — prompt chaining, routing, parallelisation, orchestrator-workers, evaluator-optimizer — to something you have actually seen at work. Your harness is an evaluator-optimizer loop; be able to say that sentence in an interview and defend it.",lk:[{t:"Building effective agents",u:"https://www.anthropic.com/engineering/building-effective-agents"}]}
]},
{d:10,ph:2,th:"Postgres depth",why:"Your resume reads frontend-heavy. Backend depth is the fastest route to a better band.",t:[
 {id:"d10a",tr:"sys",m:50,ti:"Indexes, EXPLAIN and the query plan",de:"Read the first three chapters of Use The Index, Luke. Then in your own project: seed 200k run rows, write the dashboard query, run EXPLAIN ANALYZE, add the correct composite index, re-run, and record before/after milliseconds in the README. That before/after number is an interview answer you own.",lk:[{t:"Use The Index, Luke",u:"https://use-the-index-luke.com/"}]},
 {id:"d10b",tr:"dsa",m:40,ti:"Pattern 6 — trees I",de:"LeetCode 226, 104, 543, 110, 100, 572. Write level-order traversal both recursively and iteratively; you should be able to produce the iterative version in under three minutes."},
 {id:"d10c",tr:"career",m:30,ti:"Extend the target map to 50",de:"Add 25 rows. For each, name the specific team or product you would join and a concrete referral path — a person, an alumni link, a community. Weight roughly 60% best-fit, 25% stretch, 15% safety."}
]},
{d:11,ph:2,th:"Redis depth",why:"Caching and rate limiting come up in almost every backend round at your level.",t:[
 {id:"d11a",tr:"sys",m:50,ti:"Redis patterns, implemented not just read",de:"Read the Redis docs on data types and expiry. Then implement three things in your project: a per-tenant token-bucket rate limiter, a cache with explicit invalidation, and a lock around run scheduling. Write ten lines on why naive SETNX locks are unsafe and what fencing tokens fix.",lk:[{t:"Redis docs",u:"https://redis.io/docs/latest/develop/"}]},
 {id:"d11b",tr:"dsa",m:40,ti:"Pattern 7 — trees II",de:"LeetCode 235, 102, 199, 98, 230. For 98, be able to articulate why passing min/max bounds down is correct and comparing only against the parent is not."},
 {id:"d11c",tr:"career",m:30,ti:"Two more no-ask conversations",de:"Message two people from your target map. Still no ask. Ask about their team's stack, or a decision from a post on their engineering blog. Log date and question so you never repeat yourself."}
]},
{d:12,ph:2,th:"Queues and workers",why:"This is where your distributed-systems interview story comes from — from failures you actually hit.",t:[
 {id:"d12a",tr:"build",m:55,ti:"Parallelise runs with a real queue",de:"Move run execution to BullMQ workers with concurrency limits, exponential backoff, idempotency keys and a dead-letter queue for poisoned scenarios. Add a smoke test that enqueues 50 scenarios and asserts none are lost or duplicated. Write down every failure mode you hit — that list is worth more than the code."},
 {id:"d12b",tr:"dsa",m:40,ti:"Pattern 8 — heaps and priority queues",de:"LeetCode 703, 1046, 973, 215, 621. Implement a binary heap by hand once so you understand sift-up and sift-down, then use the library forever after."},
 {id:"d12c",tr:"ai",m:25,ti:"Cost and latency accounting",de:"Add per-run token and cost accounting to the harness: input/output tokens, model, a price table, cost per conversation. Add p50/p95 turn latency. Cost-per-resolved-conversation is the metric AI product teams live and die by — own it and quote it."}
]},
{d:13,ph:2,th:"Scoring and your first case study",why:"Weekly engineering-blog case studies are how system design stops feeling like theory.",t:[
 {id:"d13a",tr:"build",m:60,ti:"Deterministic assertions plus an LLM judge",de:"Implement assertions (did it call the expected tool? did it fill the required slot? did it escalate when it should?) and a judge with an explicit rubric returning a score plus reasoning. Store both. Compute task-success rate per suite. Assertions catch regressions; the judge catches quality — you need both and you should be able to explain why."},
 {id:"d13b",tr:"sys",m:35,ti:"Case study 1 — storing billions of messages",de:"Read Discord's engineering post on message storage. Write a ten-line summary answering: what broke, what they moved to, what they traded away. Repeat weekly. Twelve of these summaries is what makes a design round feel easy.",lk:[{t:"Discord engineering blog",u:"https://discord.com/blog"}]},
 {id:"d13c",tr:"dsa",m:25,ti:"Spaced repetition — redo three failures",de:"Re-solve from a blank file the three problems you failed or needed hints for this week. If you still cannot, write the invariant or recurrence in plain English first, then code it."}
]},
{d:14,ph:2,th:"Flex and correct",ms:"~55 problems logged; harness runs end to end locally",why:"Every second week has a catch-up day. Plans without slack fail in week 5.",t:[
 {id:"d14a",tr:"rev",m:60,ti:"Catch-up block — nothing new",de:"Clear the oldest unchecked tasks from days 1-13. If you are genuinely clear, spend the hour making the harness README good enough that a stranger can run it with one command."},
 {id:"d14b",tr:"rev",m:30,ti:"Weekly review and pace check",de:"Log hours, problems, outreach. Read the ahead/behind number on the dashboard. If you are more than five tasks behind, cut one DSA problem per day — never the project. The project is your differentiator; DSA is a gate you can pass with less volume than the internet claims."},
 {id:"d14c",tr:"career",m:30,ti:"Resume review, round 1",de:"Send resume v2 to two senior engineers with exactly one question: 'Would you interview this for a 1-2 YOE backend or applied-AI role, and what makes you hesitate?' Never ask 'any feedback' — you will get none worth having."}
]},
{d:15,ph:3,th:"Live dashboard",why:"Streaming UI is a real skill and it demos in ten seconds. Build it once, properly.",t:[
 {id:"d15a",tr:"build",m:80,ti:"Run dashboard with SSE streaming",de:"React view: suite list, run table, live turn-by-turn transcript over SSE, metrics header (success rate, avg turns, p95 latency, cost). TanStack Query for fetches, native EventSource for the stream, explicit loading / empty / error states. Plain and fast — no component library needed.",lk:[{t:"TanStack Query",u:"https://tanstack.com/query/latest"}]},
 {id:"d15b",tr:"dsa",m:40,ti:"Pattern 9 — graphs on grids",de:"LeetCode 200, 695, 133, 417, 994. Write one generic grid-BFS template into patterns.md and reuse it. Templates are how you survive a 45-minute screen."}
]},
{d:16,ph:3,th:"Make the judge trustworthy",why:"This single task is the most credible thing in the entire project. Do not skip it.",t:[
 {id:"d16a",tr:"build",m:80,ti:"Validate the judge against 30 human labels",de:"Hand-label 30 conversations pass/fail yourself. Measure the judge against your labels: agreement rate, false-pass rate, false-fail rate. Iterate the rubric and few-shot examples until agreement clears 90%. Commit the labelled set as a test fixture. 'My judge agrees with human labels 93% of the time' is a sentence that ends doubt in an interview."},
 {id:"d16b",tr:"dsa",m:40,ti:"Pattern 10 — topological sort and union-find",de:"LeetCode 207, 210, 323, 261, 684. Implement union-find with path compression and union by rank from memory — it is a five-minute write once you have done it twice."}
]},
{d:17,ph:3,th:"LLD foundations",why:"Indian product companies screen with machine coding and LLD far more than distributed-systems theory at your level.",t:[
 {id:"d17a",tr:"sys",m:50,ti:"SOLID and the four patterns that keep appearing",de:"Read Strategy, Factory Method, Observer and State on Refactoring Guru. Then refactor your own harness: judges behind a Strategy interface, model providers behind a Factory, run lifecycle as an explicit State machine. Commit with a message that explains the choice, not the change.",lk:[{t:"Refactoring Guru — patterns",u:"https://refactoring.guru/design-patterns"}]},
 {id:"d17b",tr:"dsa",m:40,ti:"Pattern 11 — backtracking",de:"LeetCode 78, 46, 39, 79. Write the choose / explore / un-choose template into patterns.md with a note on where pruning goes."},
 {id:"d17c",tr:"career",m:30,ti:"Outline blog post 1",de:"Title: 'Testing conversational AI with bots: what an eval harness actually needs'. Six sections from your own build — scenario schema, simulator, assertions vs judge, judge validation numbers, CI gating, what surprised you. Zero employer specifics, all your own work."}
]},
{d:18,ph:3,th:"Machine coding rep 1",why:"Sixty minutes, timer on, no internet. This round is pass/fail at most product companies.",t:[
 {id:"d18a",tr:"sys",m:60,ti:"Timed: in-memory key-value store with TTL",de:"60 minutes: get/set with TTL, lazy plus periodic expiry, LRU eviction at capacity, thread-safe, unit tests. Then spend ten minutes writing what you would fix — interviewers score that self-critique as highly as the code.",lk:[{t:"awesome-low-level-design",u:"https://github.com/ashishps1/awesome-low-level-design"}]},
 {id:"d18b",tr:"dsa",m:35,ti:"Pattern 12 — 1-D dynamic programming",de:"LeetCode 70, 198, 213, 5, 322. For each, write the state definition as one English sentence before you write any code. If you cannot say the state, you cannot write the recurrence."},
 {id:"d18c",tr:"career",m:25,ti:"Referral asks, round 1",de:"For the five warmest contacts from your no-ask messages, send a specific ask: role link, two lines on why you fit that team, resume attached. Specific beats polite. Five real asks beat fifty portal submissions."}
]},
{d:19,ph:3,th:"RAG, done properly",why:"You have shipped knowledge-base retrieval. Now be able to prove you know why it works.",t:[
 {id:"d19a",tr:"ai",m:60,ti:"Hybrid retrieval with measured recall",de:"Over your own docs: chunk with overlap, embed, store in pgvector, add BM25 keyword search, fuse both with reciprocal rank fusion, then rerank top-50 to top-5. Write 20 questions with known answers and measure recall@5 before and after hybrid plus rerank. Numbers, not vibes — that comparison is the interview answer.",lk:[{t:"pgvector",u:"https://github.com/pgvector/pgvector"}]},
 {id:"d19b",tr:"dsa",m:35,ti:"Pattern 13 — intervals and greedy",de:"LeetCode 56, 57, 253, 53, 55. Meeting Rooms II with a heap is asked constantly; do it twice."},
 {id:"d19c",tr:"sys",m:25,ti:"Case study 2 — search and ranking at scale",de:"Read one engineering-blog post on search or ranking infrastructure from Uber, Swiggy or Meesho. Ten-line summary in the same format as last week.",lk:[{t:"Uber engineering",u:"https://www.uber.com/en-IN/blog/engineering/"},{t:"Swiggy Bytes",u:"https://bytes.swiggy.com/"}]}
]},
{d:20,ph:3,th:"CI as a quality gate",why:"A CI job that fails a PR on model quality regression is a thing almost nobody your level has built.",t:[
 {id:"d20a",tr:"build",m:60,ti:"Quality gate in GitHub Actions",de:"Workflow: run your suite against a pinned model on every PR, compare task-success and p95 latency against the last green run stored as an artifact, fail if success drops more than 3 points or cost rises more than 20%. Screenshot a failing run and put it in the README.",lk:[{t:"GitHub Actions docs",u:"https://docs.github.com/en/actions"}]},
 {id:"d20b",tr:"career",m:35,ti:"Draft blog post 1",de:"1,200 words from your outline. Include the judge-agreement number, one YAML snippet and the architecture diagram. Write like an engineer explaining a decision, not like a tutorial explaining a library."},
 {id:"d20c",tr:"dsa",m:25,ti:"Spaced repetition plus weakest pattern",de:"Redo this week's three hardest problems from blank files. Then one extra problem from whichever pattern in patterns.md has the thinnest notes."}
]},
{d:21,ph:3,th:"Publish and distribute",ms:"Harness MVP + validated judge + blog post 1 live",why:"Work nobody sees is work nobody hires for. Distribution is half the value.",t:[
 {id:"d21a",tr:"career",m:45,ti:"Publish post 1 and distribute it",de:"Publish. Then a LinkedIn post with a five-line summary written for engineers rather than recruiters, plus a share in two relevant communities. Link the repo. This is where inbound starts, and inbound converts three to five times better than applications."},
 {id:"d21b",tr:"build",m:45,ti:"Repo polish pass",de:"README: problem, 60-second quickstart via docker compose up, architecture diagram, metrics table with real numbers, limitations, roadmap. Add issue templates and three good-first-issues. A repo that looks maintained gets read; one that looks abandoned gets closed."},
 {id:"d21c",tr:"rev",m:30,ti:"Weekly review and pick calibration companies",de:"Log everything. Then choose the three companies you will apply to on Day 25 as calibration interviews — real, mid-tier, not your dream. Your first loop in a year should not be your best opportunity."}
]},
{d:22,ph:3,th:"Ship it publicly",why:"'Deployed and demo-able in ten seconds' is a completely different artifact from 'runs on my machine'.",t:[
 {id:"d22a",tr:"build",m:80,ti:"Deploy API, worker and dashboard",de:"Fly.io or Railway for services, managed Postgres (Neon or Supabase), managed Redis (Upstash). Real domain, HTTPS, health checks, all config via env vars per 12-Factor, and a seeded demo suite so a visitor sees results without an API key. Test it from your phone on mobile data.",lk:[{t:"The Twelve-Factor App",u:"https://12factor.net/"},{t:"Fly.io docs",u:"https://fly.io/docs/"}]},
 {id:"d22b",tr:"dsa",m:40,ti:"Pattern 14 — 2-D dynamic programming",de:"LeetCode 62, 1143, 494, 309. Draw the DP table for 1143 by hand on paper once before you code it."}
]},
{d:23,ph:3,th:"Observability",why:"You can talk about traces and spans, or you can have instrumented a system yourself. Only one survives follow-up questions.",t:[
 {id:"d23a",tr:"build",m:80,ti:"OpenTelemetry traces, metrics and structured logs",de:"A span per run, per turn and per model call, with token counts and cost as span attributes. Export to a free backend (Grafana Cloud or SigNoz). Structured JSON logs with a request id threaded through. Record a 60-second video walking one trace from run down to a single model call.",lk:[{t:"OpenTelemetry docs",u:"https://opentelemetry.io/docs/"},{t:"SigNoz",u:"https://signoz.io/docs/"}]},
 {id:"d23b",tr:"sys",m:40,ti:"Case study 3 — idempotency and retries",de:"Read Stripe or Cloudflare engineering on idempotency keys, retries or rate limiting. Then write down exactly where your own harness would double-run or double-charge, and fix one of them today.",lk:[{t:"Stripe engineering blog",u:"https://stripe.com/blog/engineering"},{t:"Cloudflare blog",u:"https://blog.cloudflare.com/"}]}
]},
{d:24,ph:3,th:"Package the evidence",why:"A project that is not on the resume in one sharp line does not exist to a recruiter.",t:[
 {id:"d24a",tr:"career",m:50,ti:"Turn the project into resume and portfolio lines",de:"Add: 'Built and open-sourced ConvoEval, a conversational-AI evaluation harness — YAML scenarios, LLM user simulator, judge validated at N% agreement against 30 human labels, CI gate blocking quality regressions; TypeScript, Postgres, Redis/BullMQ, deployed with OpenTelemetry tracing.' Replace your weakest existing bullet if the page overflows. One page, always."},
 {id:"d24b",tr:"sys",m:40,ti:"Design on paper: multi-tenant LLM gateway",de:"45 minutes written: API keys and quotas per tenant, model routing and fallback, streaming, response caching, rate limiting, cost attribution, audit logging, failure modes. You work adjacent to this daily — make it your default design answer and keep the diagram."},
 {id:"d24c",tr:"dsa",m:30,ti:"Pattern 15 — tries and bit manipulation",de:"LeetCode 208, 211, 136, 191, 338. Implement trie insert/search/startsWith without looking anything up. For bits, learn x & (x-1) and XOR pairing as your two workhorses and note both in patterns.md."}
]},
{d:25,ph:3,th:"Enter the market",why:"Loops take four to eight weeks. Applications must start now for offers to land by Day 90.",t:[
 {id:"d25a",tr:"career",m:55,ti:"Finalise both resume variants, apply to three calibration companies",de:"Variant A: applied AI / AI product engineer. Variant B: backend-leaning full-stack. Same facts, different ordering and emphasis. Paste each into a plain text editor — if the layout scrambles, an ATS will scramble it too. Then apply to your three calibration companies today and log them."},
 {id:"d25b",tr:"intv",m:35,ti:"Build your interview inventory",de:"List every round you will face: DSA screen, machine coding, LLD, HLD, backend deep-dive, frontend deep-dive, AI/LLM deep-dive, hiring manager, behavioural, bar raiser. Score yourself 1-5 on each. Your bottom three get extra sessions in weeks 6-9 — that decision is the whole point of the list."},
 {id:"d25c",tr:"dsa",m:30,ti:"Process drill, not just correctness",de:"30 minutes, two unseen mediums, no hints. Score yourself on: clarified inputs and constraints out loud, stated approach before coding, complexity analysis, tested one edge case unprompted. You lose screens on process far more often than on algorithms."}
]},
{d:26,ph:3,th:"DP consolidation",why:"DP is the pattern candidates fake. A one-page decision guide beats fifty solved problems.",t:[
 {id:"d26a",tr:"dsa",m:50,ti:"DP consolidation set",de:"LeetCode 300, 139, 416, 152, 91. Then write a one-page decision guide in patterns.md: when 1-D versus 2-D, when memoisation beats tabulation, how you spot subset-sum in disguise, and the three state definitions that cover most interview DP."},
 {id:"d26b",tr:"build",m:40,ti:"Multi-provider support behind one interface",de:"Add a second and third provider behind your Factory: Claude, OpenAI, and a local model via Ollama. Same scenario suite, three models, one results table. You are building toward a public benchmark that people will actually share.",lk:[{t:"Ollama",u:"https://ollama.com/"}]},
 {id:"d26c",tr:"career",m:30,ti:"Five targeted applications",de:"Five, each with three lines in the referral or cover field naming the specific team problem you would work on. Log every one with date and channel — you will need channel-level conversion data on Day 35."}
]},
{d:27,ph:3,th:"HLD fundamentals",why:"You want the mental model, not a memorised list of interview answers.",t:[
 {id:"d27a",tr:"sys",m:55,ti:"The fundamentals block",de:"Work through System Design Primer on caching, sharding, replication, consistency models and queues. For each, write one sentence on where it appears in a product you personally use. Skip the question dumps at the end.",lk:[{t:"System Design Primer",u:"https://github.com/donnemartin/system-design-primer"}]},
 {id:"d27b",tr:"dsa",m:35,ti:"Pattern 16 — matrix and math",de:"LeetCode 48, 54, 73, 202, 50. These are implementation-care problems, not insight problems — the failure mode is index bookkeeping, so write your loop bounds down on paper before you code."},
 {id:"d27c",tr:"intv",m:30,ti:"STAR stories 1-4",de:"From the brag doc: shipping under a hard deadline, a production incident you handled, a disagreement with someone senior, and the security-vulnerability remediation work. 200 words each, a number in every Result."}
]},
{d:28,ph:4,th:"30-day retro",ms:"Project deployed, resume final, applications flowing",why:"One honest audit now is worth more than two weeks of optimistic effort.",t:[
 {id:"d28a",tr:"rev",m:50,ti:"Honest 30-day retro",de:"Answer three questions in writing: would a recruiter now read me as a one-year engineer with a specialty; is the project demo-able in three minutes to a stranger; am I past 90 problems with real pattern notes. Whichever answer is worst gets 20 extra minutes a day for the next 30."},
 {id:"d28b",tr:"career",m:40,ti:"Pipeline audit and diagnosis",de:"Count applications, referral asks, replies, screens. Under 20% reply rate means targeting or resume, and more volume will not fix it. Screens booked but failed means shift time to DSA and machine coding. Diagnose before you push harder."},
 {id:"d28c",tr:"dsa",m:30,ti:"Pressure test",de:"Virtual LeetCode contest — take a past weekly and give yourself 30 minutes for as many as you can. Performing under a clock is a separate skill from being correct at leisure."}
]},
{d:29,ph:4,th:"Prove frontend depth",why:"You will be asked to defend React choices. Have measurements, not opinions.",t:[
 {id:"d29a",tr:"build",m:45,ti:"Measured frontend improvements",de:"In your dashboard: virtualise the run table, add optimistic updates with correct cache invalidation in TanStack Query, handle SSE reconnection with backoff and resume. Run Lighthouse before and after and record both numbers in the README.",lk:[{t:"react.dev",u:"https://react.dev/learn"}]},
 {id:"d29b",tr:"dsa",m:40,ti:"Weak-pattern sprint",de:"Your two weakest patterns from patterns.md, three problems each. No new patterns today — closing a gap is worth more than widening coverage this week."},
 {id:"d29c",tr:"career",m:35,ti:"Five applications, two referral follow-ups",de:"Five more. Follow up once, politely, on any referral ask older than seven days. One follow-up, then let it go — chasing costs you more than it returns."}
]},
{d:30,ph:4,th:"Machine coding rep 2",why:"Splitwise-style problems are the single most common machine-coding prompt in India.",t:[
 {id:"d30a",tr:"sys",m:60,ti:"Timed: expense splitter (Splitwise)",de:"60 minutes: users, groups, equal / exact / percentage split strategies, balance simplification, extensible for new split types, unit tests. Then draw the class diagram you actually ended up with and compare it against what you would design now with 20 minutes of hindsight."},
 {id:"d30b",tr:"intv",m:35,ti:"STAR stories 5-8",de:"Ownership of something nobody asked you to own, unblocking or mentoring someone, a mistake you made and what changed afterwards, delivering for a demanding enterprise client. Numbers in every Result."},
 {id:"d30c",tr:"ai",m:25,ti:"Context engineering for agents",de:"Read Anthropic's engineering writing on context engineering and on writing effective tools for agents. Note three things you would change about how your harness builds simulator context and names its tools.",lk:[{t:"Anthropic engineering",u:"https://www.anthropic.com/engineering"}]}
]}
];
var PLAN_B = [
{d:31,ph:4,th:"Build the benchmark",why:"A reproducible public benchmark is the highest-signal artifact an engineer at your level can own.",t:[
 {id:"d31a",tr:"build",m:80,ti:"Write 25 realistic scenarios and run all providers",de:"Five categories, five scenarios each: order status, refund with a policy edge case, escalation to a human, multi-intent turn, hostile or confused user. Run all three providers over all 25. Produce the table: task success, average turns, tool-call accuracy, p95 latency, cost per resolved conversation."},
 {id:"d31b",tr:"dsa",m:40,ti:"Hard set — sliding window and stack",de:"LeetCode 76, 239, 84, 42. Read editorials fast where needed, then re-implement from blank files. Track which ones you could not do unaided; those come back on Day 70."}
]},
{d:32,ph:4,th:"Publish the benchmark",why:"Methodology and threats-to-validity sections are what separate this from content marketing.",t:[
 {id:"d32a",tr:"career",m:80,ti:"Write and publish blog post 2 — the benchmark",de:"1,500 words: methodology, how scenarios were designed, how you validated the judge, results table, three surprising findings, threats to validity, and a one-command reproduction. Publish, post to LinkedIn, share in two communities, and link it from the repo README."},
 {id:"d32b",tr:"sys",m:40,ti:"Case study 4 — multi-tenancy and isolation",de:"Read one engineering post on multi-tenant architecture or tenant isolation from Atlassian, Freshworks, Razorpay or Zerodha Tech. Ten-line summary. Multi-tenancy is your daily reality at Kapture; make the vocabulary precise.",lk:[{t:"Zerodha Tech",u:"https://zerodha.tech/"},{t:"Atlassian engineering",u:"https://www.atlassian.com/engineering"}]}
]},
{d:33,ph:4,th:"First real mock",why:"You cannot self-assess narration. Somebody has to watch you go silent.",t:[
 {id:"d33a",tr:"intv",m:45,ti:"Mock 1 — DSA screen with a human",de:"Book a peer mock. Speak your approach out loud for the first five minutes before typing anything. Record it, watch at 1.5x, and note every silence longer than 20 seconds. Silences, not wrong answers, are what get you rejected.",lk:[{t:"interviewing.io",u:"https://interviewing.io/"},{t:"Pramp / Exponent",u:"https://www.tryexponent.com/practice"}]},
 {id:"d33b",tr:"dsa",m:40,ti:"Revision only",de:"Six already-solved problems, blank files, 40 minutes total. Speed on solved problems is what clears screens; new problems build ceiling, revision builds floor."},
 {id:"d33c",tr:"career",m:35,ti:"Six applications plus direct recruiter outreach",de:"Six applications. Then message three in-house recruiters at target companies directly: current role, lane, one artifact link, the specific role. In-house recruiters reply far more often than portals and can skip you past the first filter."}
]},
{d:34,ph:4,th:"Spring Boot and JVM depth",why:"You list Spring Boot. Be ready to defend it or take it off the resume.",t:[
 {id:"d34a",tr:"sys",m:55,ti:"Backend deep-dive prep: Spring and the JVM",de:"Bean lifecycle and scopes, transaction propagation and the classic case where @Transactional silently does nothing, connection pool sizing with HikariCP, thread-per-request versus reactive, and where N+1 queries come from with JPA. Write ten questions you would ask a candidate, then answer them in writing.",lk:[{t:"Spring guides",u:"https://spring.io/guides"}]},
 {id:"d34b",tr:"dsa",m:35,ti:"Pattern 17 — advanced graphs",de:"LeetCode 743, 787, 1584. Write Dijkstra and one MST algorithm by hand once each, then note in patterns.md when a weighted graph problem is really a shortest-path problem in disguise."},
 {id:"d34c",tr:"intv",m:30,ti:"STAR stories 9-12",de:"Ambiguous requirements you had to resolve, pushing back on scope, learning something hard fast, and the ProjectForge leadership story with the one-hour-per-day saving. Rehearse two out loud, timed to 120 seconds."}
]},
{d:35,ph:4,th:"Node internals",ms:"25+ applications out, 2 posts live, first mock done",why:"Runtime questions separate people who use Node from people who understand it.",t:[
 {id:"d35a",tr:"sys",m:50,ti:"The Node questions you will actually get",de:"Event loop phases, microtasks versus macrotasks, why one CPU-bound handler destroys throughput, worker_threads versus cluster, stream backpressure, and how you debug a memory leak in production. Then reproduce a leak locally with --inspect and heap snapshots so you have done it once.",lk:[{t:"Node.js learn",u:"https://nodejs.org/en/learn"}]},
 {id:"d35b",tr:"dsa",m:40,ti:"Timed two-problem set",de:"One medium and one hard, 40 minutes, narrating out loud the whole way as if someone is watching. Include the complexity analysis and one edge case you invent yourself."},
 {id:"d35c",tr:"rev",m:30,ti:"Weekly review and funnel math",de:"Compute reply rate, screen rate and time-to-first-response per channel: portal, referral, recruiter DM, inbound. Double the channel with the best screen rate; stop the worst entirely. Most people never measure this and keep doing the thing that does not work."}
]},
{d:36,ph:4,th:"HLD rep 1",why:"Write designs as documents first. Speaking well comes from having written it once.",t:[
 {id:"d36a",tr:"sys",m:60,ti:"45-minute design: real-time support inbox",de:"Requirements, capacity estimate, API design, data model, WebSocket fan-out and presence, read receipts, at-least-once delivery with dedupe, hot-tenant handling, and what you shard on. Write it as a doc, then time yourself explaining it in ten minutes to a wall."},
 {id:"d36b",tr:"dsa",m:35,ti:"Graph revision",de:"Five graph problems from blank files. Graphs are the highest-frequency medium category in Indian screens after arrays and strings."},
 {id:"d36c",tr:"career",m:25,ti:"Six applications",de:"Six more, logged. Hold the mix near 60% best-fit, 25% stretch, 15% safety. Do not let the stretch tier eat the whole list just because you now have artifacts."}
]},
{d:37,ph:4,th:"Package the security work",why:"Almost no 1-YOE candidate can talk credibly about broken access control. You can.",t:[
 {id:"d37a",tr:"career",m:45,ti:"Write up your vulnerability remediation properly",de:"Take the 10+ vulnerabilities you fixed and write them by class with the correct OWASP name, how it was found, the fix, and the test or gate that prevents regression. Keep it non-identifying — no customer names, no live payloads. Read the OWASP Top 10 so your terminology is exact.",lk:[{t:"OWASP Top 10",u:"https://owasp.org/www-project-top-ten/"}]},
 {id:"d37b",tr:"dsa",m:40,ti:"Pattern 18 — greedy consolidation",de:"LeetCode 45, 134, 846, 763. Write the one-line proof of why the greedy choice is safe for each; that proof is what interviewers probe."},
 {id:"d37c",tr:"build",m:35,ti:"Be a maintainer for 35 minutes",de:"Triage anything on your repo, reply to every comment, open three issues describing your own roadmap. An active issue tracker is social proof that costs almost nothing."}
]},
{d:38,ph:4,th:"Machine coding rep 3",why:"You built a rate limiter for real. Now build it under a clock with clean interfaces.",t:[
 {id:"d38a",tr:"sys",m:60,ti:"Timed: rate limiter service",de:"60 minutes: fixed window, sliding window log and token bucket behind one interface; per-key configuration; concurrency-safe; tests that prove each algorithm's boundary behaviour. Compare against the reference design in the LLD repo afterwards and note what you missed."},
 {id:"d38b",tr:"dsa",m:35,ti:"Random mixed set",de:"Five random mediums from patterns already covered. Random order is the only realistic practice condition — knowing the pattern in advance is not interview practice."},
 {id:"d38c",tr:"intv",m:25,ti:"Script your 3-minute project pitch",de:"Problem, why existing tools miss it, architecture in four sentences, one number that proves it works, one hard tradeoff you made and why. Record it, watch it, cut 20% of the words."}
]},
{d:39,ph:4,th:"Make deployment boring",why:"Boring deployment is a senior trait and it is easy to demonstrate.",t:[
 {id:"d39a",tr:"build",m:50,ti:"Production hygiene pass",de:"Multi-stage Docker build under 200MB, health and readiness endpoints, graceful shutdown that drains in-flight runs, database migrations run in CI, and a separate staging environment. Then write a 15-line runbook: how to deploy, how to roll back, what to check after."},
 {id:"d39b",tr:"sys",m:40,ti:"Kubernetes literacy, not mastery",de:"Official basics tutorial: pods, deployments, services, configmaps and secrets, liveness and readiness probes, resource requests and limits, rolling updates. Target is speaking about it accurately in an interview, not running a cluster.",lk:[{t:"Kubernetes basics",u:"https://kubernetes.io/docs/tutorials/kubernetes-basics/"}]},
 {id:"d39c",tr:"dsa",m:30,ti:"Spaced repetition",de:"Three oldest problems you failed, from blank files, 12 minutes each. If you fail the same one twice, write its invariant into patterns.md in plain English before you touch code again."}
]},
{d:40,ph:4,th:"Error analysis with counts",why:"Categorising 40 failures into named modes with counts is the exact skill applied-AI teams hire for.",t:[
 {id:"d40a",tr:"ai",m:55,ti:"Build a failure taxonomy from your own benchmark",de:"Read Hamel's field guide on rapidly improving AI products. Then take 40 failed conversations from your benchmark and sort them into five or six named failure modes with counts: retrieval miss, wrong tool, premature escalation, hallucinated policy, loop, format break. Publish the table in the repo.",lk:[{t:"Field guide to improving AI products",u:"https://hamel.dev/blog/posts/field-guide/"}]},
 {id:"d40b",tr:"dsa",m:35,ti:"Pattern review — heaps and intervals",de:"Redo LeetCode 973, 621, 253, 56, 435, 295 from blank files. Heaps and intervals together on purpose — interval problems that secretly need a heap are where people freeze."},
 {id:"d40c",tr:"career",m:30,ti:"Six applications and one warm introduction",de:"Six applications. Then ask one strong contact for a specific introduction, naming the person and the reason. Vague 'let me know if you hear of anything' asks produce nothing."}
]},
{d:41,ph:4,th:"Frontend round prep",why:"Half your experience is frontend. Do not let that round be the one you lose.",t:[
 {id:"d41a",tr:"sys",m:50,ti:"Frontend deep-dive material",de:"Rendering and reconciliation, when memoisation helps and when it lies, state colocation versus global state, server-state cache invalidation, code splitting, and Core Web Vitals. Then measure and fix one real thing in your dashboard and record the delta.",lk:[{t:"web.dev performance",u:"https://web.dev/learn/performance/"}]},
 {id:"d41b",tr:"dsa",m:35,ti:"Pattern 19 — string parsing",de:"LeetCode 71, 394, 227, 921. Parsing questions show up in machine-coding rounds far more than in DSA screens."},
 {id:"d41c",tr:"intv",m:35,ti:"Mock 2 — machine coding with a peer watching",de:"A 60-minute problem, someone observing. Ask them to score five things: requirement clarification, interface design, a working demo at the end, tests, and how you narrated tradeoffs. Get the scores in writing."}
]},
{d:42,ph:4,th:"Flex and correct",ms:"~120 problems, 3 machine-coding reps, benchmark published",why:"Second catch-up day. Use it before the interview load peaks.",t:[
 {id:"d42a",tr:"rev",m:60,ti:"Catch-up block",de:"Clear the oldest unchecked tasks. If clear, read your own repo as a hostile stranger and fix the three worst onboarding frictions."},
 {id:"d42b",tr:"rev",m:30,ti:"Weekly review and pace correction",de:"If you are more than eight tasks behind, cut the second DSA task on weekdays for two weeks and protect interview prep instead. Falling behind is expected; failing to reallocate is the actual mistake."},
 {id:"d42c",tr:"career",m:30,ti:"Resume review, round 2",de:"Send the updated resume — now with project and benchmark — to two people who did not see v2. Ask one question: does the project read as substantial engineering or as a toy?"}
]},
{d:43,ph:4,th:"Ship an MCP server",why:"MCP is baseline vocabulary for AI-adjacent roles now, and almost nobody at your level has shipped one.",t:[
 {id:"d43a",tr:"build",m:80,ti:"Expose the harness over MCP",de:"Tools: run_suite, get_run, compare_runs, list_failures. Test it from a real MCP client end to end. Document the tool schemas in the README with a note on how you designed the tool descriptions for an agent rather than for a human.",lk:[{t:"Model Context Protocol",u:"https://modelcontextprotocol.io/"}]},
 {id:"d43b",tr:"dsa",m:40,ti:"Hard DP set",de:"LeetCode 72, 97, 518. Editorials where needed, then re-implement, then write the recurrence in words in patterns.md."}
]},
{d:44,ph:4,th:"AI-assisted development, described honestly",why:"Every team asks about this now. The good answer includes where it fails and what review you added.",t:[
 {id:"d44a",tr:"ai",m:70,ti:"Set up a real agentic dev loop and evaluate it",de:"On your own repo: a project context file (CLAUDE.md or equivalent), a test-first prompt loop, and one genuine automation — generate scenario YAML from a spec, or auto-triage failing runs into your taxonomy. Then write 300 words on where it helped, where it produced confident garbage, and what review discipline you added. That essay is your interview answer.",lk:[{t:"Claude Code best practices",u:"https://www.anthropic.com/engineering/claude-code-best-practices"}]},
 {id:"d44b",tr:"sys",m:50,ti:"Kafka delivery semantics",de:"Read the Kafka design doc sections on delivery semantics, consumer groups and log compaction. Then write where your harness needs at-least-once plus idempotency, and where ordering genuinely matters versus where you only think it does.",lk:[{t:"Kafka design",u:"https://kafka.apache.org/documentation/#design"}]}
]},
{d:45,ph:4,th:"HLD rep 2 — your home turf",why:"Make the design closest to your day job your single strongest answer.",t:[
 {id:"d45a",tr:"sys",m:55,ti:"45-minute design: voice bot platform",de:"Telephony ingress, streaming STT, LLM turn with barge-in handling, TTS, a sub-500ms perceived latency budget broken down component by component, session state, call recording and retention, per-tenant isolation. Produce an actual latency budget table — that table is the thing interviewers remember."},
 {id:"d45b",tr:"dsa",m:35,ti:"Revision block",de:"Redo LeetCode 3, 424, 76, 239, 121, 567 — the sliding-window family, blank files, 35 minutes total. Highest screen frequency of any single pattern."},
 {id:"d45c",tr:"career",m:30,ti:"Six applications and one ghost-revival",de:"Six more. Then send one short follow-up to a recruiter — never the portal — at a company that went quiet three or more weeks ago. Revival rate is surprisingly high."}
]},
{d:46,ph:4,th:"Testing credibility",why:"'I write tests' is worthless. 'Here is what I chose not to test and why' is senior.",t:[
 {id:"d46a",tr:"build",m:50,ti:"Real tests, real coverage, real reasoning",de:"Unit tests for scoring, integration tests for the runner against a stub bot, one Playwright test for the dashboard happy path. Coverage reported in CI with a badge. Then write four lines in the README on what you deliberately did not test and why.",lk:[{t:"Playwright",u:"https://playwright.dev/"}]},
 {id:"d46b",tr:"dsa",m:35,ti:"Pattern 20 — prefix sums and counting",de:"LeetCode 560, 238, 523, 974. The insight to write down: prefix sums plus a hash map converts subarray problems into pair-counting problems."},
 {id:"d46c",tr:"intv",m:35,ti:"Mock 3 — HLD with a senior engineer",de:"45 minutes on a problem you have not prepared. Ask for scoring on requirement gathering, estimation, tradeoff articulation, and whether you drove the conversation or waited to be led."}
]},
{d:47,ph:4,th:"Know your number",why:"Comp conversations start earlier than you expect. Never quote a number you cannot justify.",t:[
 {id:"d47a",tr:"career",m:45,ti:"Set walk-away, target and stretch numbers",de:"Research 1-2 YOE Bengaluru bands across your tiers on levels.fyi and AmbitionBox. Write three numbers, each as base plus variable plus equity, each backed by two data points. Also write the sentence you will use when asked before you are ready: a deflection you can say without hesitating.",lk:[{t:"levels.fyi",u:"https://www.levels.fyi/"},{t:"AmbitionBox",u:"https://www.ambitionbox.com/"}]},
 {id:"d47b",tr:"sys",m:45,ti:"Transactions, isolation and the outbox pattern",de:"Isolation levels and which anomaly each permits, optimistic versus pessimistic locking, and the transactional outbox for reliable event publishing. Implement the outbox in your harness for run-completion events so you have shipped it, not just read it."},
 {id:"d47c",tr:"dsa",m:30,ti:"Timed set",de:"Two mediums drawn from weeks 2-3 material, 30 minutes, narrated aloud as if someone is watching. Old material under time pressure is the real test, not new material at leisure."}
]},
{d:48,ph:4,th:"Portfolio that closes",why:"One fast page that a hiring manager reads in 90 seconds and forwards to someone else.",t:[
 {id:"d48a",tr:"career",m:60,ti:"Build and deploy the one-page portfolio",de:"Positioning line, three projects each with a number, the benchmark table embedded, writing links, resume PDF, contact. Fast, no template smell, works on a phone. Deploy on Vercel with your own domain and link it from your resume header, LinkedIn and GitHub profile.",lk:[{t:"Vercel docs",u:"https://vercel.com/docs"}]},
 {id:"d48b",tr:"dsa",m:35,ti:"Weak-pattern sprint",de:"Your two weakest patterns from patterns.md, three problems each. Choose by which notes are thinnest, not by which feel hardest — those are different things."},
 {id:"d48c",tr:"career",m:25,ti:"Six applications",de:"Six more, each logged with the channel it came through. Update your funnel numbers as you go so Day 56 has real data rather than an impression."}
]},
{d:49,ph:4,th:"Consolidate the evidence",ms:"Portfolio live, comp number set, 3 mocks done",why:"Post-mortems are the difference between candidates who converge and candidates who repeat.",t:[
 {id:"d49a",tr:"rev",m:45,ti:"Write post-mortems for every round so far",de:"For each screen and round: what was asked, what you said, what you would say now. Convert each gap into one concrete practice task and schedule it in this tracker. Candidates who do this convert; candidates who do not fail the same round three times."},
 {id:"d49b",tr:"sys",m:40,ti:"Case study 5 — cost engineering, then do it",de:"Read one engineering post on infrastructure or LLM cost reduction. Then cut your own benchmark's cost per conversation by 30% using prompt caching, a smaller model for the simulator, and early stopping. Document before and after in the README."},
 {id:"d49c",tr:"dsa",m:35,ti:"Random mixed set",de:"Five random mediums from across every pattern covered. Use a random picker so you cannot pre-load the pattern in your head before you start reading."}
]},
{d:50,ph:5,th:"Company-specific preparation",why:"Generic preparation loses to a candidate who read their engineering blog last night.",t:[
 {id:"d50a",tr:"intv",m:55,ti:"Build a prep sheet per live process",de:"For your top eight: what the product does, their two most recent engineering blog posts, the interview format from Glassdoor or LeetCode discuss, three questions you will ask them, and which of your twelve stories maps to their actual problem. Reuse the sheet before every round."},
 {id:"d50b",tr:"dsa",m:35,ti:"Revision block",de:"Redo LeetCode 105, 124, 297, 235, 230, 199 — the tree set most likely to show up in a screen, blank files."},
 {id:"d50c",tr:"career",m:30,ti:"Six applications, weighted to stretch",de:"You now have a benchmark, three posts and a deployed project. Push harder into tier A than you did in week 4 — your artifacts changed what is realistic."}
]},
{d:51,ph:5,th:"Machine coding rep 4",why:"Notification service is a favourite because it tests interfaces, retries and rate limits at once.",t:[
 {id:"d51a",tr:"sys",m:60,ti:"Timed: notification service",de:"60 minutes: multiple channels behind one interface, templates with variable substitution, retries with backoff, per-user rate limits, deduplication, and a pluggable priority queue. Tests. Then diff your design against the reference implementation."},
 {id:"d51b",tr:"intv",m:35,ti:"Rehearse all twelve stories out loud",de:"90 seconds each, no notes visible. Record two, watch them back, and cut the filler words you did not know you say."},
 {id:"d51c",tr:"dsa",m:25,ti:"One hard, timed",de:"One hard, 25 minutes on the clock, then the editorial, then re-implement from a blank file. One hard done properly beats three skimmed."}
]},
{d:52,ph:5,th:"Distributed systems literacy",why:"These concepts are what separate an SDE-1 answer from an SDE-2 answer in the same room.",t:[
 {id:"d52a",tr:"sys",m:55,ti:"Concepts, in your own words",de:"CAP and what PACELC adds, quorum reads and writes, leader election, consistent hashing, backpressure and load shedding, and the real difference between availability and durability. One paragraph each in your notes, written in your own words — if you cannot write it, you cannot say it under pressure.",lk:[{t:"Google SRE book",u:"https://sre.google/sre-book/table-of-contents/"}]},
 {id:"d52b",tr:"dsa",m:35,ti:"Pattern review — trees and tries",de:"Redo LeetCode 208, 211, 212, 226, 110, 543 — tries plus tree recursion, blank files. If 212 still breaks you, it becomes your Day 70 target."},
 {id:"d52c",tr:"career",m:30,ti:"Referral round 2",de:"Ask three new contacts, now with a portfolio link, a benchmark and three published posts. Your ask is materially stronger than it was in week 3 — the same people who ignored you then may respond now."}
]},
{d:53,ph:5,th:"Defend your own project",why:"The project round is where you either look like the author or look like a tourist.",t:[
 {id:"d53a",tr:"intv",m:50,ti:"Adversarial project deep-dive with a peer",de:"45 minutes where they interrogate your architecture: why not X, what happens at scale, where does cost blow up, which decision is weakest. Write down every question you answered badly and fix your notes the same day."},
 {id:"d53b",tr:"sys",m:40,ti:"Answer the three hardest challenges in writing",de:"Why not just use an existing eval platform. How do you stop the judge from being wrong in a correlated way. How does this scale to ten thousand conversations a night. Written answers, three paragraphs each, kept in the repo docs folder."},
 {id:"d53c",tr:"dsa",m:30,ti:"Random mixed set",de:"Five random mediums, random order, 30 minutes. Score yourself only on whether you named the pattern out loud within 90 seconds of reading it."}
]},
{d:54,ph:5,th:"Negotiation, learned in advance",why:"You negotiate best when you learned how weeks before the offer, not the night before.",t:[
 {id:"d54a",tr:"career",m:50,ti:"Read the negotiation playbook end to end and write your scripts",de:"Read Haseeb Qureshi's guide fully. Then write your own scripts: deflecting the first comp question, whether and how you disclose current CTC, asking for time without sounding uninterested, and creating competing timelines honestly. Write them as sentences you would actually say.",lk:[{t:"How not to bomb your offer negotiation",u:"https://haseebq.com/how-not-to-bomb-your-offer-negotiation/"}]},
 {id:"d54b",tr:"dsa",m:35,ti:"Revision block",de:"Redo LeetCode 322, 300, 139, 416, 91, 152 — the DP set worth having automatic, blank files."},
 {id:"d54c",tr:"career",m:35,ti:"Six applications and pipeline hygiene",de:"Six more. Then clean the tracker: mark dead processes dead, set a follow-up date on everything live, and write the next action for each. A tracker you do not trust is worse than none."}
]},
{d:55,ph:5,th:"Blog post 3 — the systems post",why:"Two AI posts and one systems post is the right mix for the roles you want.",t:[
 {id:"d55a",tr:"career",m:60,ti:"Write and publish the systems post",de:"Pick the most technical thing you built: the queue and idempotency design, the SSE streaming path with reconnection, or the judge-validation methodology. 1,200 words, one diagram, real numbers, and one thing you got wrong first. Publish and distribute."},
 {id:"d55b",tr:"dsa",m:35,ti:"Hard set",de:"Two hards with editorials, then re-implemented from blank files. Write the key insight for each into patterns.md in one sentence — that sentence is what you will actually recall."},
 {id:"d55c",tr:"intv",m:25,ti:"Write your ten questions for them",de:"Questions that make you sound senior: how they measure engineering quality, how on-call works, what shipped last quarter, how technical decisions get made, what would make them regret this hire in six months. Keep them in every prep sheet."}
]},
{d:56,ph:5,th:"60-day retro and hard reprioritisation",ms:"60-day mark: pipeline health check, 3 posts, 4 machine-coding reps",why:"The plan bends here based on evidence, not feelings.",t:[
 {id:"d56a",tr:"rev",m:50,ti:"Find the leak and fix that step only",de:"Compute: screens per ten applications, screen-to-onsite rate, onsite-to-offer rate. Whichever step leaks most gets 60% of your remaining prep time. Zero screens from 40+ applications is a targeting and resume problem — fix that this week, not with more volume."},
 {id:"d56b",tr:"career",m:40,ti:"Decide: widen or go deep",de:"Three or more live processes means stop applying broadly and go deep on conversion. Fewer than two means add 15 companies, include remote and forward-deployed-engineer roles, and ask five more referrals in one sitting. Decide deliberately; do not drift."},
 {id:"d56c",tr:"rev",m:30,ti:"Deliberate recovery",de:"Genuinely light. Read something unrelated to interviews, sleep early. Burnout in week nine is the single most common way a 90-day plan dies, and it always looks like 'I will just push through this week'."}
]},
{d:57,ph:5,th:"Loop simulation",why:"Onsite fatigue is real and it is trainable.",t:[
 {id:"d57a",tr:"intv",m:55,ti:"Back-to-back rounds, same sitting",de:"A 45-minute DSA round immediately followed by 25 minutes of machine coding, no break. Note precisely where fatigue changed your quality — that is the point of the exercise, not the scores."},
 {id:"d57b",tr:"dsa",m:35,ti:"Revision block",de:"Redo LeetCode 200, 207, 210, 133, 684, 417 — the graph set, blank files, reproducing your generic BFS and DFS templates from memory each time."},
 {id:"d57c",tr:"career",m:30,ti:"Follow-ups only, no new applications",de:"Follow up on every live process with a short specific message and ask for a timeline. Timelines are what let you align offers later — ask early and ask plainly."}
]},
{d:58,ph:5,th:"HLD rep 3 — your unfair advantage",why:"Permission-aware retrieval is where your access-control work meets your AI work. Almost nobody covers it.",t:[
 {id:"d58a",tr:"sys",m:55,ti:"45-minute design: document-grounded enterprise assistant",de:"Ingestion pipeline, chunking and embedding at scale, hybrid retrieval, permission-aware retrieval so a user never sees a document they cannot access, caching, production evals, and cost per query. The permissions layer is the part most candidates miss entirely — lead with it."},
 {id:"d58b",tr:"dsa",m:35,ti:"Pattern review — DP",de:"Redo LeetCode 62, 1143, 72, 518, 309, 494 — 2-D DP, blank files. Write table dimensions and base cases before coding each one."},
 {id:"d58c",tr:"intv",m:30,ti:"Map stories to rounds",de:"For each live process, choose which four stories you will tell and in which round. Do not improvise this on the day; the story you forget is always your best one."}
]},
{d:59,ph:5,th:"Interrogate your own resume",why:"Any line you cannot defend for three minutes is a liability, not an asset.",t:[
 {id:"d59a",tr:"intv",m:50,ti:"Line-by-line defence drill",de:"For every bullet: what exactly did I do, what were the alternatives, why this choice, what was the measurable result, what broke. Rewrite or remove anything you cannot defend for three minutes today."},
 {id:"d59b",tr:"dsa",m:35,ti:"Random mixed set",de:"Five random mediums. Log which pattern you reached for first and whether it was correct. Misidentification, not implementation, is what loses screens."},
 {id:"d59c",tr:"sys",m:35,ti:"Case study 6 — write your own postmortem",de:"Read a real public postmortem from Cloudflare, GitHub or Anthropic engineering. Then write a proper postmortem for a bug you shipped at work, in the same structure: impact, timeline, root cause, contributing factors, action items. Interviewers respond strongly to this.",lk:[{t:"Cloudflare blog",u:"https://blog.cloudflare.com/"}]}
]},
{d:60,ph:5,th:"One real open-source PR",why:"A merged PR in a repo you did not create signals more than ten personal projects.",t:[
 {id:"d60a",tr:"build",m:55,ti:"Find, fix and submit",de:"Pick a tool you actually use: an eval library, a provider SDK, a Postgres or queue client. Find a good-first-issue or a documentation gap you personally hit, and land a small clean PR with a test. Small and merged beats ambitious and ignored."},
 {id:"d60b",tr:"dsa",m:35,ti:"Revision block",de:"Redo LeetCode 146, 155, 355, 703, 208, 981 — the design-flavoured problems, blank files. These double as machine-coding warmups."},
 {id:"d60c",tr:"career",m:30,ti:"Choreograph your interview calendar",de:"Sequence loops so the opportunities you want most land last, and cluster likely offer dates inside a ten-day window. Ask recruiters to move dates to achieve this — they almost always can, and it is the highest-leverage negotiation move you will make."}
]}
];
var PLAN_C = [
{d:61,ph:5,th:"Turn rejection into curriculum",why:"Two rejections naming the same gap is a syllabus, not bad luck.",t:[

{d:63,ph:5,th:"Behavioural mastery",ms:"~150 problems, 12 rehearsed stories, pipeline in late stages",why:"The tenure question is coming in every single loop. Have one clean answer.",t:[
 {id:"d63a",tr:"intv",m:50,ti:"Hiring manager and bar-raiser rehearsal",de:"45 minutes with someone senior playing HM: why leave after a year, what you want next, a disagreement, your weakness, handling an ambiguous product spec. Your tenure answer is growth trajectory plus the specific systems you want to build next — never money, never complaints about your current team."},
 {id:"d63b",tr:"dsa",m:35,ti:"Timed two-problem set",de:"One medium and one hard, 35 minutes, narrated end to end including complexity analysis and one edge-case test you invent yourself."},
 {id:"d63c",tr:"rev",m:35,ti:"Weekly review and energy audit",de:"Log everything. Then check sleep and work hours honestly. Below 6.5 hours of sleep, cut this plan to 90 minutes a day rather than cutting sleep. Interviews are performance events; being sharp beats being prepared-but-fried."}
]},
{d:64,ph:5,th:"The three hard questions",why:"These three decide more outcomes than any algorithm you will practise.",t:[
 {id:"d64a",tr:"intv",m:45,ti:"Script and rehearse the three you cannot afford to fumble",de:"1) Why are you leaving after a year? 2) What is your current CTC and expectation? 3) What would you do differently on your last project? Each under 90 seconds spoken, rehearsed aloud, with every defensive word removed. Record and re-record until they sound calm."},
 {id:"d64b",tr:"dsa",m:35,ti:"Revision block",de:"Redo LeetCode 53, 55, 45, 763, 846, 134 — greedy, blank files. Say the exchange argument out loud for each; that is exactly what interviewers probe."},
 {id:"d64c",tr:"build",m:40,ti:"Ship harness v2 based on real signal",de:"If anyone used, starred or filed an issue, act on that first. Otherwise ship the thing you know is weakest: failure diffing between prompt versions, or a shareable public report page per run."}
]},
{d:65,ph:5,th:"Production LLM reliability",why:"This is the exact material an applied-AI interview probes, and you have real ground truth for it.",t:[
 {id:"d65a",tr:"ai",m:55,ti:"Reliability material, then implement two pieces",de:"Structured output enforcement, retries on malformed tool calls, prompt caching economics, streaming with partial-failure handling, PII redaction before logging, and prompt-injection defence for tool-using agents. Then implement redaction and structured-output validation in your harness so you have shipped both.",lk:[{t:"Claude API docs",u:"https://docs.claude.com/"}]},
 {id:"d65b",tr:"dsa",m:35,ti:"Random mixed set",de:"Five random mediums, 35 minutes. If all five feel comfortable, DSA is no longer your constraint — move that time to design and behavioural next week."},
 {id:"d65c",tr:"career",m:30,ti:"Push for timelines",de:"Ask every live process for a decision date. Say truthfully that you are in other late-stage processes. That single sentence accelerates loops more than anything else you can do."}
]},
{d:66,ph:5,th:"HLD rep 4",why:"You just instrumented a system with OTel. Design the thing you were sending data to.",t:[

 {id:"d66b",tr:"dsa",m:35,ti:"Pattern review — arrays, strings, two pointers",de:"Redo LeetCode 238, 560, 128, 49, 347, 36 — arrays and hashing at speed, blank files, target under five minutes each."},
 {id:"d66c",tr:"intv",m:30,ti:"Re-record the project pitch",de:"Three minutes, now with benchmark results and the failure taxonomy. Compare against your week-6 recording and cut everything you now hear as vague."}
